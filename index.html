async function hashPin(pin){
  if(!pin)return '';
  if(window.crypto&&window.crypto.subtle){
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('FL_PIN:'+pin));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  return 'plain:'+pin;
}

  if(!stored)return Promise.resolve(true);
  if(stored.startsWith('plain:'))return Promise.resolve('plain:'+input===stored);

}

function purge(){
  const n=Date.now(),D=864e5;
  S.lists=S.lists.filter(l=>!l.del||n-l.del<15*D);
  S.shop=S.shop.filter(x=>!x.done||n-x.at<62*D);
  if(S.lists.length===1&&S.lists[0].id==='l1'&&!S.shop.some(x=>(x.l||'l1')==='l1'))S.lists=[];
  if(S.shop.some(x=>!x.l)&&!S.lists.some(l=>l.id==='l1'))S.lists.push({id:'l1',n:'Lista della spesa'});
  const T=iso(today());
  S.items.forEach(i=>{
    if(i.med&&!i.plan)i.plan=[{n:'',q:i.med.q,times:i.med.times,from:i.med.from,to:i.med.to}];
    const P=(i.plan||[]).filter(p=>p.to),a0=P.map(p=>p.from||i.date).sort()[0],b0=P.map(p=>p.to).sort().slice(-1)[0];
    if(P.length&&T>=a0&&T<=b0&&i.date<T){i.date=T;i.done=false;i.doneAt=0}
  });
  S.trash=S.trash.filter(i=>n-i.del<15*D);
  S.items=S.items.filter(i=>!(i.done&&i.doneAt&&n-i.doneAt>15*D));
  [...S.items,...S.trash].forEach(i=>{
    if(i.img&&i.imgAt&&n-i.imgAt>30*D)i.img=null;
    if(i.cat==='auto'&&i.sub==='730 e dichiarazioni'){i.cat='fisco';i.sub='730'}
    if(i.cat==='salute'&&i.sub==='Medicine e terapie'){i.cat='medicine';i.sub='Terapie e piani'}
    if(i.cat==='medicine'&&i.plan&&i.plan.length){i.cat='piano';i.sub='Terapia giornaliera'}
    if(i.cat==='medicine'&&i.sub==='Terapie e piani')i.sub='Confezioni e scorte';
  });
}

function shrink(f){
  return new Promise(r=>{
    const im=new Image(),u=URL.createObjectURL(f);
    im.onload=()=>{
      const k=Math.min(1,760/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=im.width*k;c.height=im.height*k;
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.55));
    };
    im.onerror=()=>r(null);im.src=u;
  });
}

return `${X}${esc(p.name)}${p.id===S.owner?' 👑':''}${C}<p style="color:var(--mu);margin:.2rem 0">${p.id===S.owner?'Amministratore':'Familiare'}</p>`+h('Compiti assegnati')+(ch.length?ch.map(c=>`<div class="box">🏡 ${esc(c.title)}</div>`).join(''):none)+h(adm||mine?'Eventi':'Eventi in comune con te')+(ev.length?ev.map(i=>`<div class="box"><b>${cat(i.cat).i} ${esc(i.title)}</b><br><small style="color:var(--mu)">${fd(i.date)}${i.time?' · '+esc(i.time):''} · ${esc(W(i))}</small></div>`).join(''):none)+h('Impostazioni')+(adm?`<form class="box" data-form="pset" data-id="${p.id}"><label>Età (regola la grandezza di testi e pulsanti)<input name="ag" type="number" min="10" max="95" value="${esc(p.age)}"></label><button class="btn pri" style="width:100%;margin-top:.6rem">Salva</button>${p.id!==S.owner?`<button type="button" class="btn dng" style="width:100%;margin-top:.6rem" data-act="mdel" data-id="${p.id}">Rimuovi dalla famiglia</button>`:''}</form>${p.id!==S.owner?`<form class="box" data-form="mpin" data-id="${p.id}"><label style="margin-top:0">PIN personale di ${esc(p.name)} (${p.pin?'impostato':'non impostato'})<input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" maxlength="8" placeholder="Nuovo PIN · vuoto = rimuovi"></label><button class="btn" style="width:100%;margin-top:.6rem">🔑 Reimposta PIN</button></form>`:''}`:'<div class="box" style="color:var(--mu)">Solo l’amministratore può modificare le impostazioni.</div>')+(mine?'':`<form data-form="swp" data-id="${p.id}">${!adm&&S.pin?'<label>PIN amministratore per cambiare profilo</label><input name="pin" type="password" inputmode="numeric" maxlength="8" required>':''}<button class="btn" style="width:100%;margin-top:.6rem">Entra come ${esc(p.name)}</button></form>`)}
const STAY=`<label style="display:flex;gap:.5rem;align-items:center;margin-top:.8rem"><input type="checkbox" name="stay" checked style="width:1.6rem;height:1.6rem;min-height:0"> Resta connesso</label>`;
const gh=(t,b)=>`<div style="max-width:28rem;margin:0 auto"><h1 class="h1-gate">${t}</h1>${b}</div>`;
function regGate(){return gh('Benvenuto in Family Life!',`<p style="color:var(--mu);text-align:center">Crea la tua famiglia: tu sei l’amministratore e inviterai gli altri con un link e un codice.</p><form data-form="greg"><label>Il tuo nome<input name="nm" required maxlength="30"></label><label>Età<input name="ag" type="number" min="10" max="95" required inputmode="numeric"></label><label>Scegli un PIN (4-8 numeri)<input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" minlength="4" maxlength="8" required></label>${CONSENT}${STAY}<button class="btn pri" style="width:100%;margin-top:1rem">Crea famiglia</button></form>`)}
function joinGate(c){return gh('Benvenuto in Family Life!',`<p style="color:var(--mu);text-align:center">Conferma il codice ricevuto dall’amministratore, poi inserisci nome ed età.</p><form data-form="join"><label>Codice<input name="code" required minlength="6" maxlength="6" value="${esc(c)}" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:.2em;font-weight:800"></label><label>Nome<input name="nm" required maxlength="30"></label><label>Età<input name="ag" type="number" min="10" max="95" required inputmode="numeric"></label><label>PIN personale (facoltativo, 4-8 numeri)<input name="mypin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" maxlength="8"></label>${DOCF}${CONSENT}${STAY}<button class="btn pri" style="width:100%;margin-top:1rem">Entra ✓</button></form>`)}
function loginGate(){return gh('Accedi',`<form data-form="glogin"><label>Nome utente<input name="nm" required maxlength="30" autocomplete="username"></label><label>Codice famiglia<input name="code" required minlength="6" maxlength="6" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:.2em;font-weight:800"></label><label>PIN (se impostato)<input name="pin" type="password" inputmode="numeric" maxlength="8"></label>${STAY}<button class="btn pri" style="width:100%;margin-top:1rem">Entra</button><button type="button" class="btn" style="width:100%;margin-top:.5rem" data-act="forgot">Hai dimenticato il PIN?</button></form>`)}
let gmode='';
function forgotGate(){return gh('Recupera PIN',`<p style="color:var(--mu);text-align:center">Amministratore: inserisci il codice di recupero ricevuto alla registrazione. Se sei un familiare, chiedi all’amministratore di reimpostare il tuo PIN.</p><form data-form="gforgot"><label>Codice famiglia<input name="code" required minlength="6" maxlength="6" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:.2em;font-weight:800"></label><label>Codice di recupero<input name="rec" required maxlength="9" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:.15em;font-weight:800"></label><label>Nuovo PIN (4-8 numeri)<input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" minlength="4" maxlength="8" required></label><button class="btn pri" style="width:100%;margin-top:.8rem">Reimposta PIN</button><button type="button" class="btn" style="width:100%;margin-top:.5rem" data-act="gback">‹ Torna all’accesso</button></form>`)}
function gate(){const g=$('gate'),inv=location.hash.match(/^#invito-([A-Z0-9]{6})$/i);if(!S.reg){g.innerHTML=inv?joinGate(inv[1].toUpperCase()):regGate();g.hidden=false}else if(S.out){g.innerHTML=gmode==='forgot'?forgotGate():loginGate();g.hidden=false}else g.hidden=true}

function dv(i){const s=i.nextElementSibling;if(!s||!s.classList.contains('dv'))return;s.textContent=i.value?(i.type==='date'?'📅 '+parse(i.value).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'long',year:'numeric'}):'🕐 '+i.value):(i.type==='date'?'📅 Tocca per scegliere la data':'🕐 Tocca per scegliere l’ora')}
function decorate(r){(r||document).querySelectorAll('input[type=date],input[type=time]').forEach(i=>{if(i.dataset.dv)return;i.dataset.dv=1;i.insertAdjacentHTML('afterend','<small class="dv"></small>');dv(i)})}
['input','change'].forEach(ev=>document.addEventListener(ev,e=>{const t=e.target;if(t.matches&&t.matches('input[type=date],input[type=time]'))dv(t)}));
new MutationObserver(()=>decorate($('dlg'))).observe($('dlg'),{childList:true,subtree:true});

function open(v,triggerEl){
  if(triggerEl)lastFocus=triggerEl;
  view=v;drawDlg();
  if(!$('dlg').open)$('dlg').showModal();
}
$('dlg').addEventListener('close',()=>{
  stopLive();
  if(lastFocus&&lastFocus.isConnected){lastFocus.focus();lastFocus=null}
});

const WRITE_ACTS=['add','scan','del','dchore','newcat','newsub','mrow','restore','addmenu','newlist','addshop','ldel','lrest','qplus','qminus','sbuy','spundo','sdel','tchore'];

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]');
  if(!t){
    if(e.target===$('dlg')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}
    if(e.target===$('ban'))$('ban').hidden=true;
    return;
  }
  const a=t.dataset.act,id=t.dataset.id;
  if(WRITE_ACTS.includes(a)&&!can()){toast('🔒 Solo l’amministratore può modificare');return}
  if(a==='lock'&&me().id!==S.owner)return;
  if(a==='pushask'){await askPushPermission();return}
  if(a==='expjson'){
    const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob),el=document.createElement('a');
    el.href=url;el.download='family-life-'+S.code+'.json';el.click();URL.revokeObjectURL(url);
    toast('Backup JSON esportato ✓');return;
  }
  if(a==='toggle')mut(()=>{const it=S.items.find(i=>i.id===id);if(it.rep!=='none'&&!it.done){it.date=next(it.date,it.rep);return 'Fatto! Prossima volta: '+fd(it.date)}it.done=!it.done;it.doneAt=it.done?Date.now():0;if(it.done)logAct(actTxt(it));return it.done?'Fatto ✓':'Rimesso da fare'});
  else if(a==='edit')open({t:'form',id},t);
  else if(a==='cat')open({t:'cat',id,sub:'all'},t);
  else if(a==='sub'){view.sub=id;drawDlg()}
  else if(a==='add'){const c=t.dataset.cat,s=t.dataset.sub;$('dlg').close();open({t:'form',pc:c,ps:s,pd:t.dataset.date||(tab==='c'?calSel:'')},t)}
  else if(a==='close')$('dlg').close();
  else if(a==='del'){mut(()=>{const it=S.items.find(i=>i.id===id);S.items=S.items.filter(i=>i.id!==id);if(it)S.trash.unshift({...it,del:Date.now()})},'Spostato nel cestino (15 giorni)');$('dlg').close()}
  else if(a==='tab'){tab=id;['a','c','f','s'].forEach(k=>{$('v'+k).hidden=tab!==k;$('tb'+k).classList.toggle('on',tab===k)});document.querySelectorAll('.fab').forEach(b=>b.hidden=tab!=='a')}
  else if(a==='day'){calSel=id;render()}
  else if(a==='cm'){const d=new Date(cy,cm+Number(id),1);cy=d.getFullYear();cm=d.getMonth();render()}
  else if(a==='cw'){cw=id;render()}
  else if(a==='mrow')$('mrows').insertAdjacentHTML('beforeend',MROW)
  else if(a==='share'){const u=link(),tx='Unisciti a Family Life: apri il link e inserisci codice, nome ed età. Codice: '+S.code;if(navigator.share)navigator.share({title:'Family Life',text:tx,url:u}).catch(()=>{});else{cp(tx+' '+u);toast('Link copiato 🔗')}}
  else if(a==='copy'){cp(S.code);toast('Codice copiato')}
  else if(a==='join')open({t:'join',code:''},t)
  else if(a==='notif')open({t:'notif'},t)
  else if(a==='nread'){S.seen=S.seen||{};S.seen[id]=1;save(true);render();drawDlg()}
  else if(a==='ok'){t.classList.add('g');clearTimeout(bt);setTimeout(()=>{$('ban').hidden=true;t.classList.remove('g')},350)}
  else if(a==='arch')open({t:'arch'},t)
  else if(a==='trash')open({t:'trash'},t)
  else if(a==='live')liveScan()
  else if(a==='lsel'){S.curList=id;save();render()}
  else if(a==='addmenu')open({t:'addmenu'},t)
  else if(a==='newlist')open({t:'newlist'},t)
  else if(a==='adminreg')open({t:'adminreg'},t)
  else if(a==='prof')open({t:'prof'},t)
  else if(a==='logout'){S.out=true;save(true);$('dlg').close();$('ban').hidden=true;gate()}
  else if(a==='mdel'){if(me().id!==S.owner||id===S.owner)return;S.members=S.members.filter(m=>m.id!==id);if(S.me===id)S.me=S.owner;save();$('dlg').close();render();toast('Familiare rimosso')}
  else if(a==='addshop')open({t:'addshop'},t)
  else if(a==='qplus'){const x=S.shop.find(s=>s.id===id);const st={kg:.5,litri:.5,g:50,ml:50}[x.unit]||1;x.qty=+((x.qty||1)+st).toFixed(2);save();render()}
  else if(a==='qminus'){const x=S.shop.find(s=>s.id===id);const st={kg:.5,litri:.5,g:50,ml:50}[x.unit]||1;x.qty=Math.max(st,+((x.qty||1)-st).toFixed(2));save();render()}
  else if(a==='lrest'){const l=S.lists.find(l=>l.id===id);if(l)delete l.del;save();render();drawDlg()}
  else if(a==='ldel'){const l=S.lists.find(l=>l.id===id);if(l)l.del=Date.now();save();render();toast('Lista spostata nell’archivio')}
  else if(a==='addtm')t.closest('.pl').querySelector('.tms').insertAdjacentHTML('beforeend','<input type="time" class="pt" style="margin-bottom:.4rem">')
  else if(a==='addpl')$('pls').insertAdjacentHTML('beforeend',planRow({}))
  else if(a==='delpl')t.closest('.pl').remove()
  else if(a==='docs')open({t:'docs'},t)
  else if(a==='sbuy'){const v=parseFloat(String($('p'+id).value).replace(',','.'));if(!(v>=0)){toast('Scrivi il prezzo');return}const x=S.shop.find(s=>s.id===id);x.done=true;x.by=me().name;x.p=v;x.at=Date.now();logAct('ha comprato '+x.n);save();render();toast('Preso ✓ visibile a tutti');notifyDevice('Spesa completata',me().name+' ha preso '+x.n)}
  else if(a==='spundo'){const x=S.shop.find(s=>s.id===id);x.done=false;x.by='';x.p=0;save();render()}
  else if(a==='sdel'){S.shop=S.shop.filter(s=>s.id!==id);save();render()}
  else if(a==='newcat')open({t:'newcat'},t)
  else if(a==='newsub')open({t:'newsub',id},t)
  else if(a==='lock'){S.lock=!S.lock;save();render();toast(S.lock?'Modifiche limitate 🔒':'Modifiche libere 🔓')}
  else if(a==='restore'){mut(()=>{const k=S.trash.findIndex(i=>i.id===id);if(k>=0){const[it]=S.trash.splice(k,1);delete it.del;S.items.unshift(it)}else{const it=S.items.find(i=>i.id===id);if(it){it.done=false;it.doneAt=0}}},'Ripristinato ✓');drawDlg()}
  else if(a==='forgot'){gmode='forgot';gate()}else if(a==='gback'){gmode='';gate()}else if(a==='recshow'){if(me().id===S.owner)open({t:'rec'},t)}else if(a==='recnew'){if(me().id!==S.owner)return;S.rec=gcode();save(true);open({t:'rec'},t)}
  else if(a==='who')open({t:'person',id},t)
  else if(a==='scan')open({t:'scan',k:id},t);
  else if(a==='theme'){const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark'}
  else if(a==='tchore')mut(()=>{const c=S.chores.find(x=>x.id===id);c.done=!c.done;c.doneAt=c.done?Date.now():0;if(c.done)logAct('ha completato: '+c.title)});
  else if(a==='dchore')mut(()=>{S.chores=S.chores.filter(x=>x.id!==id)},'Compito eliminato');
});

document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.bd[data-act]')){e.preventDefault();e.target.click()}});

document.addEventListener('change',e=>{
  const s=e.target;
  if(s.id==='stayck'){S.stay=s.checked;save(true);return}
  if(s.id==='hck'){S.consent[me().id]=Object.assign({at:Date.now()},S.consent[me().id],{h:s.checked});save(true);toast(s.checked?'Consenso salute attivato':'Consenso salute revocato');return}
  if(s.name==='sl'){$('nl').hidden=s.value!=='__new';return}
  if(s.name==='sname'){const L=curL();L.n=s.value.trim()||'Lista della spesa';save();render();return}
  if(s.name==='mdoc'){s.previousSibling.textContent='✓ Foto del documento scelta';return}
  if(s.id==='scanfile'||s.id==='docfile'){onScan2(s.files[0],false);return}
  if(s.id==='joinfile'){onJoinScan(s.files[0]);return}
  if(s.id==='impjson'&&s.files[0]){
    const fr=new FileReader();
    fr.onload=()=>{try{const imp=JSON.parse(fr.result);if(imp&&Array.isArray(imp.members)){S=Object.assign(seed(),imp);purge();save();render();gate();toast('Backup importato ✓')}}catch(err){toast('File JSON non valido')}};
    fr.readAsText(s.files[0]);return;
  }
  if(s.name==='cat'&&s.form&&s.form.dataset.form==='item'){s.form.sub.innerHTML=cat(s.value).s.map(x=>`<option>${esc(x)}</option>`).join('')}
});

const AUTH_FORMS=['join','swp','areg','greg','glogin','gforgot','mypin'];

document.addEventListener('submit',async e=>{
  e.preventDefault();
  const f=e.target,d=Object.fromEntries(new FormData(f)),k=f.dataset.form;
  if(!AUTH_FORMS.includes(k)&&!can()){toast('🔒 Solo l’amministratore può modificare');return}

  if(k==='item'){
    if(['salute','medicine','piano'].includes(d.cat)&&!(S.consent[me().id]||{}).h){toast('Serve il consenso ai dati sulla salute: attivalo dal tuo profilo 👤');return}
    const whoList=new FormData(f).getAll('who').length?new FormData(f).getAll('who'):[me().name];
    mut(()=>{
      const v={cat:d.cat,sub:d.sub,title:d.title.trim(),date:d.date,note:d.note.trim(),time:d.time||'',who:whoList,rep:d.rep,ntf:whoList.filter(x=>x!==me().name),plan:readPlan(f),med:null,pk:(d.cat==='medicine'&&(d.mc||(d.mo||'').trim()))?{n:d.mc||'',o:(d.mo||'').trim()}:null};
      const it=S.items.find(i=>i.id===f.dataset.id);
      if(it)Object.assign(it,v);else S.items.unshift({id:'i'+Date.now(),done:false,...v});
    },'Salvato · le persone assegnate vedono la notifica');
    $('dlg').close();
  }
  else if(k==='join'){
    const codeU=d.code.toUpperCase();
    const m={id:'m'+Date.now(),name:d.nm.trim(),age:Math.max(10,Math.min(95,parseInt(d.ag,10)||30))};
    if(d.mypin)m.pin=await hashPin(d.mypin);
    if(window.FL_SYNC&&typeof window.FL_SYNC.pullOnce==='function'){
      const rem=await window.FL_SYNC.pullOnce(codeU);
      if(rem){
        S=Object.assign(seed(),S,rem,{docs:S.docs||{}});
      }
    }
    if(S.demo){S.members=[];S.items=[];S.chores=[];S.demo=false}
    S.members.push(m);S.me=m.id;S.code=codeU;if(!S.owner)S.owner=m.id;
    S.reg=true;S.out=false;S.stay=!!d.stay;
    S.consent[m.id]={at:Date.now(),h:!!d.consent_h};
    const fl=new FormData(f).get('mdoc'),ty=new FormData(f).get('mdt');
    if(fl&&fl.size){const img=await shrink(fl);if(img)S.docs[m.id]=[{t:ty,img}]}
    try{history.replaceState(null,'',location.pathname)}catch(x){}
    save();
    if(window.FL_SYNC&&typeof window.FL_SYNC.bindCode==='function')window.FL_SYNC.bindCode(codeU);
    $('dlg').close();render();gate();toast('Benvenuto/a '+m.name+'!');
  }
  else if(k==='scan'){scanSave(f,d)}
  else if(k==='member'){await memberSave(f)}
  else if(k==='addshop'){
    let id=d.sl;
    if(id==='__new'){const nm=(d.ln||'').trim();if(!nm){toast('Scrivi il nome della lista');return}id='l'+Date.now();S.lists.push({id,n:nm});logAct('ha creato la lista '+nm)}
    else if(!(d.n||'').trim()){toast('Scrivi il prodotto');return}
    if((d.n||'').trim()){S.shop.unshift({id:'s'+Date.now(),n:d.n.trim(),done:false,qty:Math.max(.1,parseFloat(String(d.qt).replace(',','.'))||1),unit:d.un||'',l:id});logAct('ha aggiunto '+d.n.trim()+' alla lista spesa')}
    save();render();view={t:'addshop',sl:id};drawDlg();toast('Aggiunto ✓ puoi continuare');
  }
  else if(k==='greg'){
    const ag=Math.max(10,Math.min(95,parseInt(d.ag,10)||30));
    if(S.demo){S.members=[];S.items=[];S.chores=[];S.demo=false}
    let m=S.members.find(x=>x.name.toLowerCase()===d.nm.trim().toLowerCase());
    if(m)m.age=ag;else{m={id:'m'+Date.now(),name:d.nm.trim(),age:ag};S.members.push(m)}
    S.owner=m.id;S.pin=await hashPin(d.pin);S.me=m.id;S.consent[m.id]={at:Date.now(),h:!!d.consent_h};
    S.reg=true;S.out=false;S.stay=!!d.stay;S.rec=gcode();
    save();
    if(window.FL_SYNC&&typeof window.FL_SYNC.bindCode==='function')window.FL_SYNC.bindCode(S.code);
    render();gate();open({t:'rec'});
  }
  else if(k==='glogin'){
    const codeU=String(d.code).toUpperCase();
    if(window.FL_SYNC&&typeof window.FL_SYNC.pullOnce==='function'&&codeU!==S.code){
      const rem=await window.FL_SYNC.pullOnce(codeU);
      if(rem)S=Object.assign(seed(),S,rem,{docs:S.docs||{}});
    }
    const m=S.members.find(x=>x.name.toLowerCase()===d.nm.trim().toLowerCase());
    if(!m){toast('Utente non trovato');return}
    if(codeU!==S.code){toast('Codice errato');return}
    const need=m.id===S.owner?S.pin:m.pin;
    if(need&&!(await checkPin(d.pin,need))){toast('PIN errato');return}
    S.me=m.id;S.out=false;S.stay=!!d.stay;save(true);
    if(window.FL_SYNC&&typeof window.FL_SYNC.bindCode==='function')window.FL_SYNC.bindCode(codeU);
    render();gate();
  }
  else if(k==='gforgot'){
    if(String(d.code).toUpperCase()!==S.code||!S.rec||String(d.rec).toUpperCase().replace(/[\s-]/g,'')!==S.rec){toast('Codici non corretti');return}
    S.pin=await hashPin(d.pin);S.rec=gcode();S.me=S.owner;S.out=false;gmode='';save();render();gate();open({t:'rec'});
  }
  else if(k==='mypin'){
    const m=me();if(m.id===S.owner)return;
    m.pin=d.pin?await hashPin(d.pin):undefined;save();toast(d.pin?'PIN impostato ✓':'PIN rimosso');
  }
  else if(k==='mpin'){
    if(me().id!==S.owner)return;
    const p=S.members.find(x=>x.id===f.dataset.id);
    if(p&&p.id!==S.owner){p.pin=d.pin?await hashPin(d.pin):undefined;save();toast(d.pin?'PIN di '+p.name+' reimpostato ✓':'PIN di '+p.name+' rimosso')}
  }
  else if(k==='pset'){
    const p=S.members.find(m=>m.id===f.dataset.id);
    if(p)p.age=Math.max(10,Math.min(95,parseInt(d.ag,10)||p.age));
    save();$('dlg').close();render();toast('Impostazioni salvate');
  }
  else if(k==='swp'){
    if(me().id!==S.owner&&S.pin&&!(await checkPin(d.pin,S.pin))){toast('PIN errato');return}
    S.me=f.dataset.id;save(true);$('dlg').close();render();toast('Profilo cambiato');
  }
  else if(k==='areg'){
    if(S.pin&&!(await checkPin(d.old,S.pin))){toast('PIN attuale errato');return}
    const ag=Math.max(10,Math.min(95,parseInt(d.ag,10)||30));
    let m=S.members.find(x=>x.name.toLowerCase()===d.nm.trim().toLowerCase());
    if(m)m.age=ag;else{m={id:'m'+Date.now(),name:d.nm.trim(),age:ag};S.members.push(m)}
    S.owner=m.id;S.pin=await hashPin(d.pin);S.me=m.id;S.consent[m.id]={at:Date.now(),h:!!d.consent_h};S.rec=gcode();
    save();render();open({t:'rec'});
  }
  else if(k==='newlist'){curL();const l={id:'l'+Date.now(),n:d.ln.trim()};S.lists.push(l);S.curList=l.id;save();$('dlg').close();render();toast('Lista creata 🛒')}
  else if(k==='shop'){S.shop.unshift({id:'s'+Date.now(),n:d.n.trim(),done:false,l:S.curList||'l1'});save();render();toast('Aggiunto alla lista 🛒')}
  else if(k==='newcat'){S.cats.push({id:'x'+Date.now(),n:d.nm.trim(),i:(d.em||'📁').trim(),c:PAL[S.cats.length%6],s:['Generale']});save();$('dlg').close();render();toast('Categoria creata ✓')}
  else if(k==='newsub'){const id=f.dataset.id;(S.xs[id]=S.xs[id]||[]).push(d.nm.trim());save();view={t:'cat',id,sub:'all'};drawDlg();render();toast('Sottocategoria creata ✓')}
  else if(k==='chore')mut(()=>{S.chores.unshift({id:'c'+Date.now(),title:d.title.trim(),who:(new FormData(f).getAll('who').length?new FormData(f).getAll('who'):[me().name]),done:false})},'Compito assegnato');
});

function clock(){const n=new Date();$('dt').textContent=n.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})+' · '+n.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}
clock();setInterval(clock,30000);render();gate();banner();
const hm=location.hash.match(/^#invito-([A-Z0-9]{6})$/i);if(hm&&S.reg&&!S.out)open({t:'join',code:hm[1].toUpperCase()});
</script>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

let unsub=null,activeCode='';

function setSyncStatus(mode,label){
  const d=$('sdot'),t=$('stxt');
  if(d)d.className='dot '+mode;
  if(t)t.textContent=label;
}

try{
  const app=initializeApp(window.FL_FIREBASE_CONFIG);
  const db=getFirestore(app);

  async function pullOnce(code){
    if(!code)return null;
    const snap=await getDoc(doc(db,'families',code.toUpperCase()));
    return snap.exists()?snap.data():null;
  }

  function bindCode(code){
    const c=(code||'').toUpperCase();
    if(!c)return;
    if(unsub&&activeCode===c)return;
    if(unsub){unsub();unsub=null}
    activeCode=c;
    const ref=doc(db,'families',c);
    setSyncStatus('ok','Sincronizzato · Famiglia '+c);

    unsub=onSnapshot(ref,(snap)=>{
      if(!snap.exists())return;
      const d=snap.data();
      if(!d)return;
      if(d.updatedAt&&S.updatedAt&&d.updatedAt<=S.updatedAt)return;
      const prevAct=(S.act&&S.act[0]&&S.act[0].k)||'';
      remoteLock=true;
      const keepMe=S.me,keepOut=S.out,keepStay=S.stay,keepPin=S.pin,keepRec=S.rec,keepDocs=S.docs,keepConsent=S.consent;
      S=Object.assign({},S,d,{
        me:keepMe,out:keepOut,stay:keepStay,pin:keepPin,rec:keepRec,docs:keepDocs,consent:keepConsent
      });
      if(keepMe&&!S.members.some(m=>m.id===keepMe)&&S.members.length){
        S.me=S.members[0].id;
      }
      purge();
      save(true);
      render();
      remoteLock=false;
      const topAct=S.act&&S.act[0];
      if(topAct&&topAct.k!==prevAct&&topAct.by!==me().name){
        toast('📣 '+topAct.by+' '+topAct.t);
        notifyDevice('Family Life',topAct.by+' '+topAct.t);
      }
    },()=>{
      setSyncStatus('warn','Cloud in attesa · Locale');
    });
  }

  window.FL_SYNC={
    bindCode,
    pullOnce,
    push:async(state)=>{
      const c=(state.code||'').toUpperCase();
      if(!c)return;
      const payload={
        code:c,
        owner:state.owner||'',
        lock:!!state.lock,
        pin:state.pin||'',
        members:state.members||[],
        items:state.items||[],
        chores:state.chores||[],
        shop:state.shop||[],
        lists:state.lists||[],
        trash:state.trash||[],
        cats:state.cats||[],
        xs:state.xs||{},
        act:(state.act||[]).slice(0,50),
        updatedAt:state.updatedAt||Date.now()
      };
      await setDoc(doc(db,'families',c),payload,{merge:true});
      setSyncStatus('ok','Sincronizzato · Famiglia '+c);
    }
  };

  if(S.code){
    bindCode(S.code);
    if(S.reg&&!S.out){
      pullOnce(S.code).then(rem=>{
        if(rem&&(!rem.updatedAt||rem.updatedAt>(S.updatedAt||0))){
          remoteLock=true;
          S=Object.assign({},S,rem,{docs:S.docs,consent:S.consent});
          purge();save(true);render();
          remoteLock=false;
        }
      }).catch(()=>{});
    }
  }else{
    setSyncStatus('warn','In attesa di codice famiglia');
  }
}catch(e){
  setSyncStatus('warn','Cloud non collegato · Locale');
}
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body>
