async function hashPin(pin,saltHex){
 const salt=saltHex?Uint8Array.from(saltHex.match(/../g).map(h=>parseInt(h,16))):crypto.getRandomValues(new Uint8Array(16));
 const key=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveBits"]);
 const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:310000,hash:"SHA-256"},key,256);
 return hex(salt)+":"+hex(bits);
}

function pinFail(){try{const l=JSON.parse(localStorage.getItem(LOCK_K)||"{}");l.n=(l.n||0)+1;if(l.n>=5)l.until=Date.now()+Math.min(900,30*2**(l.n-5))*1000;localStorage.setItem(LOCK_K,JSON.stringify(l))}catch(e){}}
function pinOk(){try{localStorage.removeItem(LOCK_K)}catch(e){}}
async function guardedCheck(pin,st){
 const s=lockLeft();
 if(s>0)throw new Error("Troppi tentativi, riprova tra "+s+" secondi");
 const ok=await checkPin(pin,st);
 if(ok)pinOk();else pinFail();
 return ok;
}

function mergeRemote(rem){

   (remArr||[]).forEach(x=>{if(x&&x.id&&!delIds.has(x.id))map.set(x.id,x)});
   (locArr||[]).forEach(x=>{
     if(!x||!x.id||delIds.has(x.id))return;
     const r=map.get(x.id);
     if(!r||(x.modAt&&(!r.modAt||x.modAt>r.modAt)))map.set(x.id,x);
   });
   return Array.from(map.values());
 };

 if(rem.owner)S.owner=rem.owner;
 if(Array.isArray(rem.members)&&rem.members.length)S.members=rem.members;
 if(Array.isArray(rem.cats)&&rem.cats.length){
   const mergedCats=mergeById(S.cats,rem.cats);

 }
 if(Array.isArray(rem.lists)&&rem.lists.length)S.lists=mergeById(S.lists,rem.lists);
 if(rem.activeListId)S.activeListId=rem.activeListId;
 if(Array.isArray(rem.trash))S.trash=mergeById(S.trash,rem.trash);
 if(Array.isArray(rem.items))S.items=mergeById(S.items,rem.items,trashIds);
 S.gone=mergeById(S.gone||[],rem.gone||[]);
 const goneIds=new Set(S.gone.map(x=>x.id));
 S.shop=mergeById(S.shop,Array.isArray(rem.shop)?rem.shop:[],goneIds);
 if(Array.isArray(rem.pay))S.pay=mergeById(S.pay,rem.pay).sort((a,b)=>b.at-a.at);

function exportPayCsv(){

   if(!P.length)return toast("Nessun articolo comprato e pagato da esportare");

   const sorted=[...P].sort((a,b)=>
     mk(b.at).localeCompare(mk(a.at))||
     String(a.by||"").localeCompare(String(b.by||""))||
     cat(a.cat).n.localeCompare(cat(b.cat).n)||
     (b.at-a.at)
   );

   const catTotals=new Map();
   const userMonthCatTotals=new Map();
   sorted.forEach(p=>{
     const m=mk(p.at);
     const who=p.by||"Senza nome";
     const cName=cat(p.cat).n;
     const tot=Number(p.a||0);
     const q=Math.max(1,Number(p.qty)||1);
     catTotals.set(cName,{
       tot:(catTotals.get(cName)?.tot||0)+tot,
       qty:(catTotals.get(cName)?.qty||0)+q,
       count:(catTotals.get(cName)?.count||0)+1
     });
     const key=`${who}||${m}||${cName}`;
     userMonthCatTotals.set(key,(userMonthCatTotals.get(key)||0)+tot);
   });

   const rows=[
     ["Nome Utente","Mese","Data","Categoria","Articolo / Voce","Quantita","Importo Unitario EUR","Totale Articolo EUR","Subtotale Utente Mese Categoria EUR"]
   ];

   sorted.forEach((p,idx)=>{
     const d=new Date(p.at);
     const m=mk(p.at);
     const who=p.by||"Senza nome";
     const cName=cat(p.cat).n;
     const q=Math.max(1,Number(p.qty)||1);
     const tot=Number(p.a||0);
     const unit=p.unitAmt!==undefined&&p.unitAmt!==null?Number(p.unitAmt):+(tot/q).toFixed(4);
     const next=sorted[idx+1];
     const nextKey=next?`${next.by||"Senza nome"}||${mk(next.at)}||${cat(next.cat).n}`:"";
     const curKey=`${who}||${m}||${cName}`;

       p.t,
       String(q),
       fmtNum(unit),
       fmtNum(tot),

         `${info.count} articoli pagati`,

         "",
         fmtNum(info.tot),
         ""
       ]);
     });

   const csv="\uFEFF"+rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(";")).join("\r\n");
   const u=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"})),a=document.createElement("a");

 }catch(e){toast("Errore esportazione CSV")}
}

 const allInList=S.shop.filter(x=>(x.listId||S.lists[0].id)===curList.id&&(!x.done||Date.now()-x.at<57600000));
 const doneCount=allInList.filter(x=>x.done).length;

 return `<h2>🛒 Liste spesa</h2>
 <div class="chips" role="group" aria-label="Liste spesa">${S.lists.map(l=>`<button type="button" class="btn sm ${l.id===curList.id?"on":""}" data-act="slist" data-id="${esc(l.id)}">${esc(l.name)}</button>`).join("")}</div>

   return `<div class="card ${x.done?"done":""}"><div class="bd" style="cursor:default"><b>${esc(x.n)}</b><br><small>${x.done?`✓ ${esc(x.by)} · ${q} pz · ${f2(x.p)}`:`Da comprare · ${q} pz`}</small>${x.done?"":`<div class="row" style="margin-top:.48rem;flex-wrap:wrap"><div class="qty-box" aria-label="Regola quantità"><button type="button" class="qbtn" data-act="qdec" data-id="${esc(x.id)}" aria-label="Diminuisci quantità">−</button><span class="qval">${q}</span><button type="button" class="qbtn" data-act="qinc" data-id="${esc(x.id)}" aria-label="Aumenta quantità">+</button></div><div class="row" style="gap:.32rem"><input id="p${esc(x.id)}" inputmode="decimal" placeholder="€ prezzo" style="width:6.2rem"><button class="btn sm pri" data-act="sbuy" data-id="${esc(x.id)}">✓ Preso</button></div></div>`}</div><button class="btn sm dng" data-act="sdel" data-id="${esc(x.id)}" aria-label="Elimina">🗑</button></div>`;
 }).join(""):'<div class="box">Lista vuota.</div>');
}

const monthName=m=>new Date(+m.slice(0,4),+m.slice(5)-1,1).toLocaleDateString("it-IT",{month:"long",year:"numeric"});
function payBlock(list){
 const g={};list.forEach(p=>(g[p.by]=g[p.by]||[]).push(p));
 return Object.keys(g).sort().map(n=>`<div class="box"><div class="row"><b>👤 ${esc(n)}</b><b>${f2(g[n].reduce((s,p)=>s+p.a,0))}</b></div>${g[n].sort((a,b)=>b.at-a.at).map(p=>`<div class="row"><small>${esc(cat(p.cat).i)} ${esc(p.t)}${(Number(p.qty)||1)>1?" ×"+Number(p.qty):""} · ${fd(iso(new Date(p.at)))}</small><small>${f2(p.a)}</small></div>`).join("")}</div>`).join("")||'<div class="box mu">Nessun pagamento.</div>';
}
function payHtml(){
 const P=S.pay.filter(p=>(isAdmin()||p.by===me().name)&&Number(p.a||0)>0),cur=mk(Date.now()),old=[...new Set(P.map(p=>mk(p.at)).filter(m=>m!==cur))].sort().reverse();
 return `<div class="row"><h2>💶 Pagamenti di ${esc(monthName(cur))}</h2>${P.length?`<button class="btn sm" data-act="csv">📥 CSV</button>`:""}</div>${payBlock(P.filter(p=>mk(p.at)===cur))}`+(old.length?`<h2>🗄️ Archivio pagamenti</h2><small class="mu">Ogni estratto resta visibile per il mese successivo (più un giorno), poi si cancella.</small>${old.map(m=>`<h2 style="text-transform:capitalize">${esc(monthName(m))}</h2>${payBlock(P.filter(p=>mk(p.at)===m))}`).join("")}`:"");
}
function trashHtml(){
 const T=S.trash.filter(i=>isAdmin()||WA(i).includes(me().name));
 return `<h2>🗑️ Cestino</h2><small class="mu">Gli elementi restano 16 giorni.</small>`+(T.length?T.map(i=>`<div class="card"><div class="bd" style="cursor:default"><b>${esc(i.title)}</b><br><small>Si cancella tra ${Math.max(1,Math.ceil((16*864e5-(Date.now()-i.del))/864e5))} g</small></div><button class="btn sm" data-act="trestore" data-id="${esc(i.id)}" aria-label="Ripristina">↩︎</button><button class="btn sm dng" data-act="tdel" data-id="${esc(i.id)}" aria-label="Elimina">🗑</button></div>`).join(""):'<div class="box mu">Vuoto.</div>');
}

document.addEventListener("submit",async e=>{
 e.preventDefault();if(busy)return;
 const f=e.target,fd_=new FormData(f),d=Object.fromEntries(fd_),k=f.dataset.form;busy=true;
 try{
   const nm=(d.nm||"").trim(),ag=Math.max(14,Math.min(95,parseInt(d.ag,10)||30));
   const stayVal=fd_.has("stay");
   if(k==="item"){
     const who=fd_.getAll("who"),id=f.dataset.id||uid("i");
     const catVal=d.cat||"bollette";
     const allowedSubs=withOtherSub(cat(catVal).s).map(x=>x.n);
     const subVal=allowedSubs.includes(d.sub)?d.sub:OTHER_SUB.n;
     const v={cat:catVal,sub:subVal,amt:Math.max(0,parseFloat(String(d.amt||"").replace(",","."))||0),title:d.title.trim(),date:d.date,time:d.time||"",note:(d.note||"").trim(),who:who.length?who:[me().name],rep:REP[d.rep]?d.rep:"none",modAt:Date.now()};
     let it=S.items.find(i=>i.id===id);
     if(it){if(!canSee(it))return;Object.assign(it,v)}else{it={id,done:false,...v};S.items.unshift(it)}
     logAct((f.dataset.id?"ha aggiornato: ":"ha aggiunto: ")+it.title);
     save();render();$("dlg").close();toast("Salvato ✓");
   }else if(k==="changecode"){
     if(!isAdmin())return;
     const nextCode=normCode(d.newcode||"");
     if(!CODE_RE.test(nextCode))return toast("Codice famiglia non valido (4-26 caratteri: A-Z, 0-9, -)");
     if(nextCode===S.code)return toast("Il codice famiglia è già questo");
     const oldCode=S.code;
     if(window.FL_SYNC){const ex=await window.FL_SYNC.pull(nextCode).catch(()=>null);if(ex)return toast("Codice famiglia già in uso")}
     S.code=nextCode;
     S.updatedAt=Date.now();
     logAct("ha aggiornato il codice famiglia in "+nextCode);
     save(true);
     render();
     toast("Nuovo codice famiglia salvato: "+nextCode);
     if(window.FL_SYNC){
       window.FL_SYNC.push(S).then(()=>{
         if(window.FL_SYNC.remove&&oldCode)window.FL_SYNC.remove(oldCode).catch(()=>{});
         window.FL_SYNC.bind(nextCode);
       }).catch(()=>{});
     }
   }else if(k==="newlist"){
     ensureLists();
     const lName=String(d.lname||"").trim().slice(0,36);
     if(!lName)return;
     const newL={id:uid("l"),name:lName,createdAt:Date.now(),modAt:Date.now()};
     S.lists.push(newL);
     S.activeListId=newL.id;
     const msg="ha creato la lista spesa: "+lName;
     logAct(msg);
     save();render();f.reset();
     toast("Lista creata e notificata ✓");
     notify("Family Life",(me().name||"Familiare")+" "+msg);
   }else if(k==="catedit"){if(!isAdmin())return;const id=f.dataset.id,o={n:d.n.trim(),i:(d.i||"📁").trim().slice(0,8),c:safeColor(d.c),s:subs(d.s||""),modAt:Date.now()},c=S.cats.find(x=>x.id===id);
     if(c)Object.assign(c,o);else{const v=S.cats.findIndex(x=>x.id==="varie");S.cats.splice(v<0?S.cats.length:v,0,{id:uid("x"),...o})}
     save();render();openDlg({t:"cats"});toast("Categoria salvata ✓")
   }else if(k==="shop"){
     ensureLists();
     const prod=d.n.trim(),qt=Math.max(1,parseInt(d.qt,10)||1);
     const curList=S.lists.find(l=>l.id===S.activeListId)||S.lists[0];
     S.shop.unshift({id:uid("s"),listId:curList.id,n:prod,qty:qt,done:false,modAt:Date.now()});
     logAct("ha aggiunto a "+curList.name+": "+prod+(qt>1?" ×"+qt:""));
     save();render();f.reset();
   }else if(k==="switchpin"){
     const t=S.members.find(x=>x.id===f.dataset.id);if(!t)return;
     if(!(await guardedCheck(d.pin,t.pin)))return toast("PIN errato");
     S.me=t.id;save(true);render();$("dlg").close();
   }else if(k==="changepin"){
     const m=S.members.find(x=>x.id===me().id);if(!m)return;
     if(!(await guardedCheck(d.opin||"",m.pin)))return toast("Vecchio PIN errato");
     if(!PIN_RE.test(d.npin||""))return toast("Il nuovo PIN deve avere 4-8 numeri");
     if(d.npin!==d.npin2)return toast("I due nuovi PIN non coincidono");
     m.pin=await hashPin(d.npin);logAct("ha aggiornato il proprio PIN");save();render();$("dlg").close();toast("PIN aggiornato ✓");
   }else if(k==="member"){
     if(!isAdmin())return;
     if(!PIN_RE.test(d.pin||""))return toast("Il PIN deve avere 4-8 numeri");
     if(d.pin!==d.pin2)return toast("I due PIN non coincidono");
     if(S.members.some(x=>x.name.toLowerCase()===nm.toLowerCase()))return toast("Nome già usato");
     S.members.push({id:uid("m"),name:nm,age:ag,pin:await hashPin(d.pin)});
     logAct("ha aggiunto "+nm+" alla famiglia");
     save();render();f.reset();toast("Familiare aggiunto ✓");
   }else if(k==="greg"){
     if(!PIN_RE.test(d.pin||""))return toast("Il PIN deve avere 4-8 numeri");
     if(d.pin!==d.pin2)return toast("I due PIN non coincidono");
     const customCode=normCode(d.code||"");
     const code=customCode||newCode();
     if(!CODE_RE.test(code))return toast("Codice famiglia non valido (4-26 caratteri: lettere, numeri o -)");
     if(window.FL_SYNC){const ex=await window.FL_SYNC.pull(code).catch(()=>null);if(ex)return toast("Codice famiglia già in uso: scegline un altro")}
     const m={id:uid("m"),name:nm,age:ag,pin:await hashPin(d.pin)};
     Object.assign(S,seed(),{code,members:[m],owner:m.id,me:m.id,reg:true,out:false,stay:stayVal,consentAt:Date.now(),fsIdx:S.fsIdx??1,themeMode:S.themeMode||"auto",seenActAt:Date.now()});
     setSessionActive(true);
     gateMode="login";
     save();render();gate();
     toast("Famiglia creata ✓ · Codice: "+code);
     if(window.FL_SYNC){
       window.FL_SYNC.push(S).then(()=>window.FL_SYNC.bind(code)).catch(()=>{});
     }
   }else if(k==="join"){
     const code=normCode(d.code||"");
     if(!CODE_RE.test(code))return toast("Codice famiglia non valido");
     if(!PIN_RE.test(d.pin||""))return toast("Il PIN deve avere 4-8 numeri");
     let rem=null;
     if(window.FL_SYNC){
       try{rem=await window.FL_SYNC.pull(code)}catch(_){}
     }
     if(!rem&&S.code!==code)return toast("Famiglia non trovata o offline: riprova");
     const base=rem?Object.assign(seed(),pick(rem)):(S.code===code?Object.assign(seed(),pick(S)):Object.assign(seed(),{code}));
     const existing=base.members.find(x=>x.name.toLowerCase()===nm.toLowerCase());
     if(existing){
       if(!(await guardedCheck(d.pin,existing.pin)))return toast("Nome già presente in famiglia: inserisci il PIN corretto");
       S=Object.assign(base,{code,me:existing.id,owner:base.owner||existing.id,reg:true,out:false,stay:stayVal,consentAt:S.consentAt||Date.now(),fsIdx:S.fsIdx??1,themeMode:S.themeMode||"auto",seenActAt:Date.now()});
     }else{
       if(d.pin2&&d.pin!==d.pin2)return toast("I due PIN non coincidono");
       const m={id:uid("m"),name:nm,age:ag,pin:await hashPin(d.pin)};
       base.members.push(m);
       if(!base.owner)base.owner=m.id;
       base.act=[{k:uid("a"),by:nm,t:"si è unito alla famiglia",at:Date.now()},...(base.act||[])].slice(0,30);
       S=Object.assign(base,{code,me:m.id,reg:true,out:false,stay:stayVal,consentAt:Date.now(),fsIdx:S.fsIdx??1,themeMode:S.themeMode||"auto",seenActAt:Date.now()});
     }
     setSessionActive(true);
     gateMode="login";
     try{history.replaceState(null,"",location.pathname)}catch(x){}
     save();render();gate();
     toast("Benvenuto/a "+nm+"!");
     if(window.FL_SYNC){
       window.FL_SYNC.push(S).then(()=>window.FL_SYNC.bind(code)).catch(()=>{});
     }
   }else if(k==="resetpin"){
     const code=normCode(d.code||"");
     if(!CODE_RE.test(code))return toast("Codice famiglia non valido");
     if(!PIN_RE.test(d.npin||""))return toast("Il nuovo PIN deve avere 4-8 numeri");
     if(d.npin!==d.npin2)return toast("I due nuovi PIN non coincidono");
     let rem=null;
     if(window.FL_SYNC){
       try{rem=await window.FL_SYNC.pull(code)}catch(_){}
     }
     const base=rem?Object.assign(seed(),pick(rem)):(S.code===code?Object.assign(seed(),pick(S)):null);
     if(!base||!base.members.length)return toast("Famiglia non trovata: verifica il codice famiglia");
     const idx=base.members.findIndex(x=>x.name.toLowerCase()===nm.toLowerCase());
     if(idx<0)return toast("Nome utente non trovato in questa famiglia");
     const adm=base.members.find(x=>x.id===base.owner);
     if(!adm)return toast("Amministratore non trovato");
     if(base.members[idx].id===base.owner)return toast("Per l'amministratore usa Profilo → Cambia PIN");
     if(!(await guardedCheck(d.apin||"",adm.pin)))return toast("PIN amministratore errato");
     base.members[idx]={...base.members[idx],pin:await hashPin(d.npin)};
     base.updatedAt=Date.now();
     base.act=[{k:uid("a"),by:base.members[idx].name,t:"ha reimpostato il proprio PIN",at:Date.now()},...(base.act||[])].slice(0,30);
     S=Object.assign(base,{code,me:base.members[idx].id,reg:true,out:false,stay:stayVal,consentAt:S.consentAt||Date.now(),fsIdx:S.fsIdx??1,themeMode:S.themeMode||"auto",seenActAt:Date.now()});
     setSessionActive(true);
     gateMode="login";
     save();render();gate();
     toast("PIN reimpostato ✓");
     if(window.FL_SYNC){
       window.FL_SYNC.push(S).then(()=>window.FL_SYNC.bind(code)).catch(()=>{});
     }
   }else if(k==="glogin"){
     const m=S.members.find(x=>x.name.toLowerCase()===nm.toLowerCase());
     if(!m||!(await guardedCheck(d.pin,m.pin)))return toast("Nome o PIN errati");
     S.me=m.id;S.reg=true;S.out=false;S.stay=stayVal;gateMode="login";
     setSessionActive(true);
     save(true);
     render();gate();
     if(S.code&&window.FL_SYNC)window.FL_SYNC.bind(S.code);
   }
 }catch(err){toast("Errore: "+(err&&err.message||err))}
 finally{busy=false}
});

let unsub=null,active="";
try{
 const app=initializeApp(window.FL_FIREBASE_CONFIG);
 await signInAnonymously(getAuth(app));
 const db=getFirestore(app),ref=c=>doc(db,"families",c);
 const pull=async c=>{const s=await getDoc(ref(String(c||"").toUpperCase()));return s.exists()?s.data():null};
 function bind(code){
   const c=String(code||"").toUpperCase();if(!c||(unsub&&active===c))return;
   if(unsub)unsub();active=c;setSt("sincronizzato");
   unsub=onSnapshot(ref(c),snap=>{
     if(!snap.exists())return;const d=snap.data();
     const prev=S.act[0]&&S.act[0].k;remoteLock=true;
     try{
       mergeRemote(pick(d));
       if(S.reg&&S.members.length&&!S.members.some(m=>m.id===S.me)){S.me="";S.out=true;setSessionActive(false);gate()}
       purge();save(true);remoteRender=true;render();remoteRender=false;
       if(Date.now()-openedAt<15000)scheduleWelcomeCheck(Math.max(1000,15000-(Date.now()-openedAt)));
     }finally{remoteLock=false}
     const top=S.act[0];
     if(top&&top.k!==prev&&top.by!==me().name){
       if(Date.now()-openedAt>=15000){
         toast("📣 "+top.by+" "+top.t,confirmHomeNotice);
       }
       notify("Family Life",top.by+" "+top.t);
     }
   },()=>setSt("in attesa · dati locali"));
 }
 window.FL_SYNC={bind,pull,push:async st=>{
   const c=st.code;if(!c)return;
   await setDoc(ref(c),{code:c,owner:st.owner,members:st.members,items:st.items,shop:st.shop,lists:st.lists,activeListId:st.activeListId,cats:st.cats,pay:st.pay,trash:st.trash,gone:st.gone||[],act:st.act.slice(0,30),updatedAt:st.updatedAt||Date.now()},{merge:true});
   setSt("sincronizzato");
 },remove:async oldCode=>{
   const oc=String(oldCode||"").toUpperCase();
   if(!oc)return;
   await deleteDoc(ref(oc));
 }};
 if(S.code&&S.reg)bind(S.code);else setSt("in attesa di famiglia");
}catch(e){setSt("non collegato · dati locali")}
</script>
</body>
</html>
