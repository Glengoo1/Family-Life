function mergeRemote(rem){
 const mergeById=(locArr,remArr,delIds=new Set())=>{
   const map=new Map();
   (remArr||[]).forEach(x=>{if(x&&x.id&&!delIds.has(x.id))map.set(x.id,x)});
   (locArr||[]).forEach(x=>{
     if(!x||!x.id||delIds.has(x.id))return;
     const r=map.get(x.id);
     if(!r||(x.modAt&&(!r.modAt||x.modAt>r.modAt)))map.set(x.id,x);
   });
   return Array.from(map.values());
 };
 const trashIds=new Set([...(rem.trash||[]),...(S.trash||[])].map(x=>x.id));
 if(rem.owner)S.owner=rem.owner;
 if(Array.isArray(rem.members)&&rem.members.length)S.members=rem.members;
 if(Array.isArray(rem.cats)&&rem.cats.length)S.cats=rem.cats;
 if(Array.isArray(rem.trash))S.trash=mergeById(S.trash,rem.trash);
 if(Array.isArray(rem.items))S.items=mergeById(S.items,rem.items,trashIds);
 if(Array.isArray(rem.shop))S.shop=mergeById(S.shop,rem.shop);
 if(Array.isArray(rem.pay))S.pay=mergeById(S.pay,rem.pay).sort((a,b)=>b.at-a.at);
 if(Array.isArray(rem.act)){
   const am=new Map();
   [...rem.act,...S.act].forEach(a=>{if(a&&a.k)am.set(a.k,a)});
   S.act=Array.from(am.values()).sort((a,b)=>b.at-a.at).slice(0,30);
 }
 if(rem.updatedAt)S.updatedAt=Math.max(S.updatedAt||0,rem.updatedAt);
}

function exportPayCsv(){
 try{
   const P=S.pay.filter(p=>(isAdmin()||p.by===me().name)&&Number(p.a||0)>0);
   if(!P.length)return toast("Nessun articolo comprato e pagato da esportare");

   const sorted=[...P].sort((a,b)=>
     mk(b.at).localeCompare(mk(a.at))||
     String(a.by||"").localeCompare(String(b.by||""))||
     cat(a.cat).n.localeCompare(cat(b.cat).n)||
     (b.at-a.at)
   );

   const catTotals=new Map();
   const userMonthCatTotals=new Map();
   sorted.forEach(p=>{
     const m=mk(p.at);
     const who=p.by||"Senza nome";
     const cName=cat(p.cat).n;
     const tot=Number(p.a||0);
     const q=Math.max(1,Number(p.qty)||1);
     catTotals.set(cName,{
       tot:(catTotals.get(cName)?.tot||0)+tot,
       qty:(catTotals.get(cName)?.qty||0)+q,
       count:(catTotals.get(cName)?.count||0)+1
     });
     const key=`${who}||${m}||${cName}`;
     userMonthCatTotals.set(key,(userMonthCatTotals.get(key)||0)+tot);
   });

   const rows=[
     ["Nome Utente","Mese","Data","Categoria","Articolo / Voce","Quantita","Importo Unitario EUR","Totale Articolo EUR","Subtotale Utente Mese Categoria EUR"]
   ];

   sorted.forEach((p,idx)=>{
     const d=new Date(p.at);
     const m=mk(p.at);
     const who=p.by||"Senza nome";
     const cName=cat(p.cat).n;
     const q=Math.max(1,Number(p.qty)||1);
     const tot=Number(p.a||0);
     const unit=p.unitAmt!==undefined&&p.unitAmt!==null?Number(p.unitAmt):+(tot/q).toFixed(4);
     const next=sorted[idx+1];
     const nextKey=next?`${next.by||"Senza nome"}||${mk(next.at)}||${cat(next.cat).n}`:"";
     const curKey=`${who}||${m}||${cName}`;
     const subCat=curKey!==nextKey?fmtNum(userMonthCatTotals.get(curKey)||0):"";

     rows.push([
       who,
       m,
       d.toLocaleDateString("it-IT"),
       cName,
       p.t,
       String(q),
       fmtNum(unit),
       fmtNum(tot),
       subCat
     ]);
   });

   rows.push(["","","","","","","","",""]);
   rows.push(["RIEPILOGO PAGATO PER CATEGORIA","Utente","Mese","Categoria","Dettaglio Voci","Quantita Totale","","Totale Categoria EUR",""]);
   Array.from(catTotals.entries())
     .sort((a,b)=>a[0].localeCompare(b[0]))
     .forEach(([cName,info])=>{
       rows.push([
         "Totale Categoria",
         isAdmin()?"Tutti i familiari":me().name,
         "Tutti i mesi",
         cName,
         `${info.count} articoli pagati`,
         String(info.qty),
         "",
         fmtNum(info.tot),
         ""
       ]);
     });

   const csv="\uFEFF"+rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(";")).join("\r\n");
   const u=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"})),a=document.createElement("a");
   a.href=u;a.download="spese-pagate-"+off(0)+".csv";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
   toast("CSV spese pagate scaricato ✓");
 }catch(e){toast("Errore esportazione CSV")}
}

let busy=false;
document.addEventListener("click",async e=>{
 const t=e.target.closest("[data-act]");
 if(!t){if(e.target===$("dlg")){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}return}
 const a=t.dataset.act,id=t.dataset.id;
 if(a==="tab"){
   tab=id;
   ["a","c","f","s"].forEach(k=>{
     $("v"+k).hidden=tab!==k;
     const b=$("tb"+k);b.classList.toggle("on",tab===k);b.setAttribute("aria-selected",String(tab===k));
   });
   $("fab").hidden=tab!=="a";
 }
 else if(a==="gmode"){gateMode=t.dataset.mode||"login";gate()}
 else if(a==="daynight"){
   const nextDark=!effectiveIsDark();
   S.themeMode=nextDark?"dark":"light";
   applyTheme();
   save(true);
   toast(nextDark?"Modalità Notte attivata 🌙":"Modalità Giorno attivata ☀️");
 }
 else if(a==="agefs"){
   const idx=Number(t.dataset.idx);
   S.fsIdx=idx;applyFont();save(true);
   toast("Modalità "+AGE_LABELS[idx]+" ("+FONT_STEPS[idx]+"px)");
 }
 else if(a==="who"){if(id===me().id||isAdmin()){S.me=id;save(true);render()}else openDlg({t:"pin",id})}
 else if(a==="ics"){const it=S.items.find(i=>i.id===id);if(it&&downloadIcs(it))toast("Evento pronto 📅")}
 else if(a==="csv")exportPayCsv();
 else if(a==="toggle"){
   const it=S.items.find(i=>i.id===id);if(!it||!canSee(it))return;
   const snap={...it};
   if(it.rep!=="none"&&!it.done){
     const pid=it.amt>0?addPay(it.cat,it.title,it.amt,1,it.amt):"";
     it.date=nextDate(it.date,it.rep);it.modAt=Date.now();
     logAct("ha completato (ricorrente): "+it.title);
     save();render();
     toast("Fatto! Prossima: "+fd(it.date),()=>{
       Object.assign(it,snap,{modAt:Date.now()});
       if(pid)S.pay=S.pay.filter(p=>p.id!==pid);
       save();render();toast("Azione annullata");
     });
   }else{
     it.done=!it.done;it.doneAt=it.done?Date.now():0;it.modAt=Date.now();
     if(it.done){logAct("ha completato: "+it.title);if(it.amt>0)it.pid=addPay(it.cat,it.title,it.amt,1,it.amt)}
     else if(it.pid){S.pay=S.pay.filter(p=>p.id!==it.pid);it.pid=""}
     save();render();
     toast(it.done?"Fatto ✓":"Rimesso da fare",()=>{
       if(it.done&&it.pid)S.pay=S.pay.filter(p=>p.id!==it.pid);
       Object.assign(it,snap,{modAt:Date.now()});
       if(snap.done&&snap.amt>0)it.pid=addPay(it.cat,it.title,it.amt,1,it.amt);
       save();render();toast("Azione annullata");
     });
   }
 }
 else if(a==="edit"){const it=S.items.find(i=>i.id===id);if(it&&canSee(it))openDlg({t:"form",id})}
 else if(a==="add")openDlg({t:"form",pd:t.dataset.date||""});
 else if(a==="close")$("dlg").close();
 else if(a==="del"){
   const it=S.items.find(i=>i.id===id);
   if(it&&canSee(it)){
     S.items=S.items.filter(i=>i.id!==id);
     const tr={...it,del:Date.now()};
     S.trash.unshift(tr);save();render();$("dlg").close();
     toast("Spostato nel cestino",()=>{
       S.trash=S.trash.filter(x=>x.id!==tr.id);
       S.items.unshift({...it,modAt:Date.now()});
       save();render();toast("Ripristinato ✓");
     });
   }
 }
 else if(a==="day"){calSel=id;render()}
 else if(a==="cm"){const d=new Date(cy,cm+Number(id),1);cy=d.getFullYear();cm=d.getMonth();render()}
 else if(a==="share"){
   const u=location.href.split("#")[0]+"#invito-"+S.code,tx="Unisciti a Family Life! Codice famiglia: "+S.code;
   if(navigator.share){navigator.share({title:"Family Life",text:tx,url:u}).catch(()=>{})}
   else{try{await navigator.clipboard.writeText(tx+" "+u);toast("Link copiato negli appunti")}catch(x){toast("Copia manualmente il codice sopra")}}
 }
 else if(a==="copy"){try{await navigator.clipboard.writeText(S.code);toast("Codice copiato")}catch(x){toast("Seleziona e copia il codice manualmente")}}
 else if(a==="cats"&&isAdmin())openDlg({t:"cats"});
 else if(a==="catedit"&&isAdmin())openDlg({t:"catedit",id});
 else if(a==="catdel"&&isAdmin()&&id!=="varie"){S.cats=S.cats.filter(c=>c.id!==id);save();render();openDlg({t:"cats"})}
 else if(a==="trestore"){
   const i=S.trash.find(x=>x.id===id);
   if(i&&canSee(i)){
     S.trash=S.trash.filter(x=>x.id!==id);
     const restored={...i};delete restored.del;restored.modAt=Date.now();
     S.items.unshift(restored);save();render();toast("Ripristinato ✓");
   }
 }
 else if(a==="tdel"){const i=S.trash.find(x=>x.id===id);if(i&&canSee(i)){S.trash=S.trash.filter(x=>x.id!==id);save();render()}}
 else if(a==="notif"){
   prevSeenActAt=Number(S.seenActAt||0);
   S.seenActAt=Date.now();
   save(true);
   updateNotifBadge();
   openDlg({t:"notif"});
 }
 else if(a==="prof")openDlg({t:"prof"});
 else if(a==="push"){
   if(!("Notification" in window))return toast("Notifiche non supportate dal browser");
   const r=await Notification.requestPermission();
   toast(r==="granted"?"Notifiche attive ✓":"Permesso notifiche non concesso");
   if(view&&view.t==="notif")drawDlg();
 }
 else if(a==="logout"){clearTimeout(welcomeCheckTimer);S.out=true;gateMode="login";save(true);$("dlg").close();gate()}
 else if(a==="wipe"){if(confirm("Cancellare tutti i dati locali? Il cloud non viene toccato.")){localStorage.removeItem(K);location.reload()}}
 else if(a==="qinc"){
   const x=S.shop.find(s=>s.id===id);
   if(x&&!x.done){x.qty=Math.max(1,(Number(x.qty)||1)+1);x.modAt=Date.now();save();render()}
 }
 else if(a==="qdec"){
   const x=S.shop.find(s=>s.id===id);
   if(x&&!x.done){
     const cur=Math.max(1,Number(x.qty)||1);
     if(cur>1){x.qty=cur-1;x.modAt=Date.now();save();render()}
     else{
       const snap={...x};
       S.shop=S.shop.filter(s=>s.id!==id);save();render();
       toast("Rimosso dalla lista",()=>{S.shop.unshift({...snap,modAt:Date.now()});save();render()});
     }
   }
 }
 else if(a==="sbuy"){
   const inp=$("p"+id),v=parseFloat(String(inp?inp.value:"").replace(",","."));
   if(!(v>=0))return toast("Scrivi il prezzo");
   const x=S.shop.find(s=>s.id===id);
   if(x){
     const q=Math.max(1,Number(x.qty)||1);
     const pid=v>0?addPay("varie",x.n,v,q,v/q):"";
     Object.assign(x,{done:true,by:me().name,p:v,at:Date.now(),modAt:Date.now(),pid});
     logAct("ha comprato "+x.n+(q>1?" ×"+q:""));save();render();
     toast("Preso ✓",()=>{
       Object.assign(x,{done:false,by:"",p:0,at:0,modAt:Date.now(),pid:""});
       if(pid)S.pay=S.pay.filter(p=>p.id!==pid);
       save();render();toast("Azione annullata");
     });
   }
 }
 else if(a==="sdel"){S.shop=S.shop.filter(s=>s.id!==id);save();render()}
});

document.addEventListener("change",e=>{const t=e.target;if(t.name==="cat"&&t.form&&t.form.dataset.form==="item")t.form.sub.innerHTML=subOpts(t.value,"")});
document.addEventListener("submit",async e=>{
 e.preventDefault();if(busy)return;
 const f=e.target,fd_=new FormData(f),d=Object.fromEntries(fd_),k=f.dataset.form;busy=true;
 try{
   const nm=(d.nm||"").trim(),ag=Math.max(14,Math.min(95,parseInt(d.ag,10)||30));
   if(k==="item"){
     const who=fd_.getAll("who"),id=f.dataset.id||uid("i");
     const v={cat:d.cat,sub:d.sub||"",amt:Math.max(0,parseFloat(String(d.amt||"").replace(",","."))||0),title:d.title.trim(),date:d.date,time:d.time||"",note:(d.note||"").trim(),who:who.length?who:[me().name],rep:REP[d.rep]?d.rep:"none",modAt:Date.now()};
     let it=S.items.find(i=>i.id===id);
     if(it){if(!canSee(it))return;Object.assign(it,v)}else{it={id,done:false,...v};S.items.unshift(it)}
     logAct((f.dataset.id?"ha aggiornato: ":"ha aggiunto: ")+it.title);
     save();render();$("dlg").close();toast("Salvato ✓");downloadIcs(it);
   }else if(k==="catedit"){if(!isAdmin())return;const id=f.dataset.id,o={n:d.n.trim(),i:(d.i||"📁").trim().slice(0,8),c:safeColor(d.c),s:subs(d.s||"")},c=S.cats.find(x=>x.id===id);
     if(c)Object.assign(c,o);else{const v=S.cats.findIndex(x=>x.id==="varie");S.cats.splice(v<0?S.cats.length:v,0,{id:uid("x"),...o})}
     save();render();openDlg({t:"cats"});toast("Categoria salvata ✓")
   }else if(k==="shop"){
     const prod=d.n.trim(),qt=Math.max(1,parseInt(d.qt,10)||1);
     S.shop.unshift({id:uid("s"),n:prod,qty:qt,done:false,modAt:Date.now()});
     logAct("ha aggiunto alla spesa: "+prod+(qt>1?" ×"+qt:""));
     save();render();
   }else if(k==="switchpin"){
     const t=S.members.find(x=>x.id===f.dataset.id);if(!t)return;
     if(!(await checkPin(d.pin,t.pin)))return toast("PIN errato");
     S.me=t.id;save(true);render();$("dlg").close();
   }else if(k==="changepin"){
     const m=S.members.find(x=>x.id===me().id);if(!m)return;
     if(!(await checkPin(d.opin||"",m.pin)))return toast("Vecchio PIN errato");
     if(!PIN_RE.test(d.npin||""))return toast("Il nuovo PIN deve avere 4-8 numeri");
     if(d.npin!==d.npin2)return toast("I due nuovi PIN non coincidono");
     m.pin=await hashPin(d.npin);logAct("ha aggiornato il proprio PIN");save();render();$("dlg").close();toast("PIN aggiornato ✓");
   }else if(k==="member"){
     if(!isAdmin())return;
     if(!PIN_RE.test(d.pin||""))return toast("Il PIN deve avere 4-8 numeri");
     if(d.pin!==d.pin2)return toast("I due PIN non coincidono");
     if(S.members.some(x=>x.name.toLowerCase()===nm.toLowerCase()))return toast("Nome già usato");
     S.members.push({id:uid("m"),name:nm,age:ag,pin:await hashPin(d.pin)});save();render();toast("Familiare aggiunto ✓");
   }else if(k==="greg"){
     if(!PIN_RE.test(d.pin||""))return toast("Il PIN deve avere 4-8 numeri");
     if(d.pin!==d.pin2)return toast("I due PIN non coincidono");
     const customCode=normCode(d.code||"");
     const code=customCode||newCode();
     if(!CODE_RE.test(code))return toast("Codice famiglia non valido (4-26 caratteri: lettere, numeri o -)");
     if(!window.FL_SYNC)return toast("Cloud non pronto: riprova tra un attimo");
     if(await window.FL_SYNC.pull(code))return toast(customCode?"Questo codice famiglia è già in uso, scegline un altro":"Collisione codice, riprova");
     const m={id:uid("m"),name:nm,age:ag,pin:await hashPin(d.pin)};
     Object.assign(S,seed(),{code,members:[m],owner:m.id,me:m.id,reg:true,out:false,consentAt:Date.now(),fsIdx:S.fsIdx??1,themeMode:S.themeMode||"auto",seenActAt:Date.now()});
     gateMode="login";
     save();await window.FL_SYNC.push(S);window.FL_SYNC.bind(code);render();gate();toast("Famiglia creata ✓ · Codice: "+code);
   }else if(k==="join"){
     const code=normCode(d.code||"");
     if(!CODE_RE.test(code))return toast("Codice famiglia non valido");
     if(!PIN_RE.test(d.pin||""))return toast("Il PIN deve avere 4-8 numeri");
     if(d.pin!==d.pin2)return toast("I due PIN non coincidono");
     if(!window.FL_SYNC)return toast("Cloud non pronto: riprova tra un attimo");
     const rem=await window.FL_SYNC.pull(code);
     if(!rem)return toast("Codice famiglia non trovato");
     const base=Object.assign(seed(),pick(rem));
     if(base.members.some(x=>x.name.toLowerCase()===nm.toLowerCase()))return toast("Nome già usato in famiglia");
     const m={id:uid("m"),name:nm,age:ag,pin:await hashPin(d.pin)};
     base.members.push(m);
     S=Object.assign(base,{code,me:m.id,reg:true,out:false,consentAt:Date.now(),fsIdx:S.fsIdx??1,themeMode:S.themeMode||"auto",seenActAt:Date.now()});
     gateMode="login";
     try{history.replaceState(null,"",location.pathname)}catch(x){}
     save();window.FL_SYNC.bind(code);render();gate();toast("Benvenuto/a "+nm+"!");
   }else if(k==="resetpin"){
     const code=normCode(d.code||"");
     if(!CODE_RE.test(code))return toast("Codice famiglia non valido");
     if(!PIN_RE.test(d.npin||""))return toast("Il nuovo PIN deve avere 4-8 numeri");
     if(d.npin!==d.npin2)return toast("I due nuovi PIN non coincidono");
     if(!window.FL_SYNC)return toast("Cloud non pronto: riprova tra un attimo");
     const rem=await window.FL_SYNC.pull(code);
     if(!rem)return toast("Codice famiglia non trovato");
     const base=Object.assign(seed(),pick(rem));
     const idx=base.members.findIndex(x=>x.name.toLowerCase()===nm.toLowerCase());
     if(idx<0)return toast("Nome utente non trovato in questa famiglia");
     base.members[idx]={...base.members[idx],pin:await hashPin(d.npin)};
     base.updatedAt=Date.now();
     base.act=[{k:uid("a"),by:base.members[idx].name,t:"ha reimpostato il proprio PIN",at:Date.now()},...(base.act||[])].slice(0,30);
     S=Object.assign(base,{code,me:base.members[idx].id,reg:true,out:false,consentAt:S.consentAt||Date.now(),fsIdx:S.fsIdx??1,themeMode:S.themeMode||"auto",seenActAt:Date.now()});
     gateMode="login";
     save();await window.FL_SYNC.push(S);window.FL_SYNC.bind(code);render();gate();toast("PIN reimpostato ✓");
   }else if(k==="glogin"){
     if(window.FL_SYNC&&S.code){const rem=await window.FL_SYNC.pull(S.code);if(rem)mergeRemote(pick(rem))}
     const m=S.members.find(x=>x.name.toLowerCase()===nm.toLowerCase());
     if(!m||!(await checkPin(d.pin,m.pin)))return toast("Nome o PIN errati");
     S.me=m.id;S.reg=true;S.out=false;gateMode="login";save(true);
     if(S.code&&window.FL_SYNC)window.FL_SYNC.bind(S.code);
     render();gate();
   }
 }catch(err){toast("Errore: "+(err&&err.message||err))}
 finally{busy=false}
});

const clock=()=>{
 const n=new Date();
 $("dt").textContent=n.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"}).toUpperCase()+" · "+n.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
 const curDay=off(0);
 if(curDay!==lastDayStr){
   if(calSel===lastDayStr)calSel=curDay;
   cy=n.getFullYear();cm=n.getMonth();lastDayStr=curDay;render();
 }
};
clock();setInterval(()=>{clock();purge()},30000);render();gate();
</script>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
let unsub=null,active="";
try{
 const app=initializeApp(window.FL_FIREBASE_CONFIG);
 await signInAnonymously(getAuth(app));
 const db=getFirestore(app),ref=c=>doc(db,"families",c);
 const pull=async c=>{const s=await getDoc(ref(String(c||"").toUpperCase()));return s.exists()?s.data():null};
 function bind(code){
   const c=String(code||"").toUpperCase();if(!c||(unsub&&active===c))return;
   if(unsub)unsub();active=c;setSt("sincronizzato");
   unsub=onSnapshot(ref(c),snap=>{
     if(!snap.exists())return;const d=snap.data();
     if(d.updatedAt&&S.updatedAt&&d.updatedAt<=S.updatedAt)return;
     const prev=S.act[0]&&S.act[0].k;remoteLock=true;
     try{
       mergeRemote(pick(d));
       if(S.reg&&S.members.length&&!S.members.some(m=>m.id===S.me)){S.me="";S.out=true;gate()}
       purge();save(true);render();
       if(Date.now()-openedAt<15000)scheduleWelcomeCheck(Math.max(1000,15000-(Date.now()-openedAt)));
     }finally{remoteLock=false}
     const top=S.act[0];
     if(top&&top.k!==prev&&top.by!==me().name){
       if(Date.now()-openedAt>=15000){
         toast("📣 "+top.by+" "+top.t,()=>{
           prevSeenActAt=Number(S.seenActAt||0);
           S.seenActAt=Date.now();
           save(true);
           updateNotifBadge();
           openDlg({t:"notif"});
         });
       }
       notify("Family Life",top.by+" "+top.t);
     }
   },()=>setSt("in attesa · dati locali"));
 }
 window.FL_SYNC={bind,pull,push:async st=>{
   const c=st.code;if(!c)return;
   await setDoc(ref(c),{code:c,owner:st.owner,members:st.members,items:st.items,shop:st.shop,cats:st.cats,pay:st.pay,trash:st.trash,act:st.act.slice(0,30),updatedAt:st.updatedAt||Date.now()},{merge:true});
   setSt("sincronizzato");
 }};
 if(S.code&&S.reg)bind(S.code);else setSt("in attesa di famiglia");
}catch(e){setSt("non collegato · dati locali")}
</script>
