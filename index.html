<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#1a2230;--mu:#4f5b6d;--ln:#d6cfc2;--ac:#2c7d5b;--s:1.15;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}

html{font-size:calc(16px*var(--s));scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 1rem/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:2px solid var(--ln);padding:.6rem .9rem}
.w{max-width:42rem;margin:auto}
.row{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
h1{font-size:1.9rem;margin:0}h2{font-size:1.25rem;margin:1.2rem 0 .6rem}

.btn{min-height:3rem;padding:.5rem .9rem;border-radius:1rem;border:2px solid var(--ln);background:var(--card);font-weight:800;cursor:pointer}

.dng{color:#d1495b;border-color:#d1495b}
.sm{min-height:2.6rem;padding:.3rem .7rem;font-size:.85rem}
.chips{display:flex;gap:.4rem;overflow-x:auto;margin:.5rem 0}

.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:.35rem}.tabs .btn{min-width:0;padding:.4rem .15rem;min-height:3rem;line-height:1.15;white-space:normal;overflow-wrap:normal;font-size:min(.85rem,2.9vw)}
#chips{flex-wrap:wrap;overflow:visible}
header{background:linear-gradient(135deg,color-mix(in srgb,#2e75b6 16%,var(--card)),color-mix(in srgb,#c27c0e 14%,var(--card)))}
.pills{display:flex;flex-wrap:wrap;gap:.6rem}.pill{padding:.6rem 1rem;border-radius:2rem;font-weight:800;cursor:pointer;border:2px solid color-mix(in srgb,var(--c) 45%,var(--card));background:color-mix(in srgb,var(--c) 16%,var(--card))}

.day{min-height:3.4rem;border-radius:.9rem;border:2px solid var(--ln);background:var(--card);cursor:pointer;padding:.2rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem}.day span{display:flex;gap:2px;height:.45rem}.day i{width:.4rem;height:.4rem;border-radius:50%}.day.tod{border-color:var(--ac)}.day.sel{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:42rem;margin:auto;padding:0 1rem 7rem}
.card{display:flex;align-items:center;gap:.8rem;padding:.9rem;border-radius:1.2rem;margin-bottom:.7rem;border:2px solid color-mix(in srgb,var(--c) 45%,var(--card));background:color-mix(in srgb,var(--c) 14%,var(--card))}
.card.done{--c:#2ea868!important}.card.done b{text-decoration:line-through}
.card.late{--c:#f59e0b!important;border-color:#f59e0b}.card.late2{--c:#dc2626!important;border-color:#dc2626}
.chk{flex:none;width:3.4rem;height:3.4rem;border-radius:1rem;border:2px solid var(--ln);background:var(--card);font-size:1.5rem;cursor:pointer}
.done .chk{background:#2ea868;color:#fff;border-color:#2ea868;font-weight:800}
.bd{flex:1;min-width:0;cursor:pointer;display:flex;flex-direction:column}
.bd small{color:var(--mu);font-weight:600;font-size:.78rem}.bd b{font-size:1.1rem;line-height:1.25}.bd span{color:var(--mu);font-size:.85rem}
em{font-style:normal;font-weight:800;font-size:.8rem;padding:.35rem .6rem;border-radius:.8rem;background:var(--card);border:1px solid var(--ln);white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.7rem}
.cat{display:flex;flex-direction:column;gap:.4rem;min-height:7rem;text-align:left;padding:.9rem;border-radius:1.2rem;cursor:pointer;border:2px solid color-mix(in srgb,var(--c) 45%,var(--card));background:color-mix(in srgb,var(--c) 14%,var(--card))}
.cat i{font-style:normal;font-size:1.8rem}.cat b{font-size:1rem}.cat small{color:var(--mu);font-weight:600}
.fab{position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 4px 14px #0004;min-height:3.2rem;max-width:calc(50% - 1.25rem);padding:.4rem .8rem;font-size:min(1rem,4.2vw);white-space:nowrap}
dialog{width:min(100% - 1rem,34rem);max-height:90vh;border:0;border-radius:1.4rem;background:var(--bg);color:var(--tx);padding:1.1rem}
dialog::backdrop{background:#0009}
label{display:block;font-weight:700;margin:.7rem 0 .2rem;font-size:.9rem}
input,select{width:100%;min-height:3rem;padding:.5rem .7rem;border-radius:.9rem;border:2px solid var(--ln);background:var(--card)}
.box{background:var(--card);border:2px solid var(--ln);border-radius:1.2rem;padding:.9rem;margin-bottom:.8rem}
.mem{padding:.7rem;border-radius:1rem;border:2px solid var(--ln);background:var(--card);cursor:pointer;text-align:center;font-weight:800}
.mem.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 18%,var(--card));color:var(--tx)}
#toast{position:fixed;left:.7rem;right:.7rem;bottom:calc(5.2rem + env(safe-area-inset-bottom,0px));z-index:20;display:flex;flex-direction:column;gap:.4rem}
.t{background:#16201bee;color:#fff;padding:.9rem 1rem;min-height:3.6rem;border-radius:1rem;font-weight:700;font-size:.95rem;display:flex;justify-content:space-between;gap:.6rem;align-items:center;pointer-events:none}
.t button{background:none;border:0;color:#8fe0b4;font-weight:800;cursor:pointer;min-height:2.4rem;font-size:.95rem;pointer-events:auto}
.qr svg{width:11rem;height:11rem;display:block}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;width:100%;max-width:100%;min-width:0;text-align:left;min-height:3rem}input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left;min-height:1.3em}dialog{overflow-x:hidden}.dv{display:block;color:var(--mu);font-weight:700;font-size:.85rem;margin:.3rem 0 0 .2rem}
.gate{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:calc(1.5rem + env(safe-area-inset-top,0px)) 1.2rem 2rem}
.ban{position:fixed;inset:0;z-index:30;background:#0007;display:flex;align-items:center;justify-content:center;padding:1rem}.bcard{background:#e6f2ec;color:#1a2230;width:min(82vw,21rem);aspect-ratio:1;border-radius:1.6rem;padding:1.3rem;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;box-shadow:0 10px 40px #0006}.bt{flex:1;display:flex;flex-direction:column;justify-content:center;gap:.5rem}.bt b{font-size:1.5rem;line-height:1.2}.bt span{font-size:1.1rem}.okb{background:#fff;color:#1a2230;border:2px solid #c9d6cf;border-radius:1rem;min-height:3.2rem;min-width:8rem;font-weight:800;font-size:1.15rem;cursor:pointer;transition:background .2s,color .2s}.okb.g{background:#2ea868;color:#fff;border-color:#2ea868}
.rt{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;align-self:stretch;gap:.6rem}.cbx{min-width:4.6rem;height:2.8rem;padding:0 .6rem;flex:none;border-radius:.8rem;border:2px solid var(--ln);background:#fff;color:#1a2230;font-size:.9rem;font-weight:800;cursor:pointer;line-height:1.1}.cbx.on{background:#bfe8cf;border-color:#2ea868}
.sp{--c:#f59e0b}.srow{display:flex;gap:.6rem;align-items:center;margin-top:.7rem}.srow .pr{flex:1;width:auto;min-width:0}.pr{width:5.4rem;min-height:2.6rem;padding:.3rem .5rem}
#dt{font-size:13px;letter-spacing:0}header{padding:.3rem .7rem}header h1{font-size:22px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}header .row>div:first-child{min-width:0}header .chips{margin:4px 0;gap:4px}header .tabs{gap:4px}header .btn.sm,header .tabs .btn,header #chips .btn{min-height:40px;padding:3px 12px;font-size:15px;border-radius:14px;font-weight:800}
#scanmsg:empty{display:none}
.logo{display:block;margin:0 auto;width:12.5rem;max-width:70%;height:auto}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{background:#f4f1ea;border-radius:1.6rem;padding:.4rem}}
:root[data-theme="dark"] .logo{background:#f4f1ea;border-radius:1.6rem;padding:.4rem}
.gate{padding:calc(.7rem + env(safe-area-inset-top,0px)) 1rem 1rem}
.gate .logo{width:auto;height:min(17vh,8.5rem);max-width:60%}
.gate h1{font-size:1.35rem;margin:.2rem 0 .3rem}
.gate p{margin:.3rem 0;font-size:.9rem}
.gate label{margin:.4rem 0 .1rem;font-size:.85rem}
.gate label span{font-size:.8rem;line-height:1.3}
.gate input{min-height:2.6rem;padding:.3rem .6rem}
.gate label>input:not([type=checkbox]):not([type=file]){margin-top:.25rem}
.gate .btn{min-height:2.7rem}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="w">
<div class="row"><div><p id="dt"></p><h1 id="hi">Ciao</h1></div>
 <div class="row"><button class="btn sm" data-act="prof" aria-label="Profilo">👤</button><button class="btn sm" data-act="notif" aria-label="Notifiche">🔔<b id="nb" style="color:#d1495b"></b></button><button class="btn sm" data-act="theme" aria-label="Cambia tema chiaro o scuro">🌓</button></div></div>

<nav class="tabs"><button class="btn on" id="tba" data-act="tab" data-id="a">🏠 Home</button><button class="btn" id="tbf" data-act="tab" data-id="f">👨‍👩‍👧 Famiglia</button><button class="btn" id="tbc" data-act="tab" data-id="c">📅 Calendario</button><button class="btn" id="tbs" data-act="tab" data-id="s">🛒 Spesa</button></nav>

<main>
<div id="va"></div>

</main>
<button class="btn pri fab" data-act="addmenu">＋ Aggiungi</button>
<button class="btn pri fab" style="right:auto;left:1rem;background:#0f8b8d;border-color:#0f8b8d" data-act="scan" data-id="bill">📷 Foto-Doc</button>

<dialog id="dlg"></dialog>
<script>
const CATS=[
{id:'bollette',n:'Bollette',i:'💡',c:'#0f8b8d',s:['Luce e gas','Acqua e rifiuti','Internet e telefono','Condominio e affitto']},
{id:'salute',n:'Visite mediche',i:'🩺',c:'#d1495b',s:['Visite specialistiche','Analisi ed esami','Dentista']},
{id:'auto',n:'Bollo e revisione',i:'🚗',c:'#2e75b6',s:['Bollo auto','Revisione e tagliando','Assicurazione','Cambio gomme','Lavori urgenti auto']},
{id:'benessere',n:'Cura e benessere',i:'🌿',c:'#3a9d6e',s:['Passeggiate','Relax e riposo','Cura della persona','Alimentazione']},
{id:'animali',n:'Animali',i:'🐾',c:'#c27c0e',s:['Veterinario','Cibo e scorte','Toelettatura','Passeggiate']},
{id:'famiglia',n:'Famiglia e ricorrenze',i:'🎂',c:'#7b4fc9',s:['Compleanni','Visite ai parenti','Anniversari','Feste']},
{id:'varie',n:'Varie',i:'🛍️',c:'#c2417f',s:['Spesa','Pagamenti vari','Commissioni e posta','Regali','Altro']},
{id:'fisco',n:'Fisco',i:'🏛️',c:'#64748b',s:['730','F24','Tari','Consorzio di bonifica','Mensa scuola','Comune','Multe e verbali']},
{id:'viaggi',n:'Viaggi',i:'✈️',c:'#e0662b',s:['Prenotazioni','Biglietti','Documenti e passaporto','Valigia e lista','Assicurazione viaggio']},
{id:'casa',n:'Casa',i:'🏠',c:'#8b5e34',s:['Assicurazione casa','Idraulico','Muratore','Pulizia caldaia','Imbianchino','Donna delle pulizie','Badante','Giardiniere','Condominio','Pulizia scale']},
{id:'medicine',n:'Medicine',i:'💊',c:'#e11d48',s:['Confezioni e scorte','Ricette','Farmacia']},
{id:'piano',n:'Piano assunzione',i:'👩‍⚕️',c:'#0891b2',s:['Terapia giornaliera','Cicli e cure']}];
const REP={none:'Non si ripete',weekly:'Ogni settimana',monthly:'Ogni mese',yearly:'Ogni anno'};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cat=id=>ALL().find(c=>c.id===id)||CATS[6];
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const off=n=>{const d=today();d.setDate(d.getDate()+n);return iso(d)};
const diff=s=>Math.round((parse(s)-today())/864e5);
const fd=s=>parse(s).toLocaleDateString('it-IT',{day:'numeric',month:'short'});
function next(s,r){const d=parse(s),g=d.getDate();if(r==='weekly')d.setDate(g+7);else{d.setDate(1);if(r==='monthly')d.setMonth(d.getMonth()+1);else d.setFullYear(d.getFullYear()+1);d.setDate(Math.min(g,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()))}return iso(d)}
const gcode=()=>Array.from({length:8},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random()*32|0]).join('');const K='family_life_v1';try{localStorage.removeItem('agenda_familiare_v4')}catch(e){}
function seed(){return{me:'',z:0,members:[],items:[],chores:[]}}
let S=(()=>{try{const v=localStorage.getItem(K);if(v)return JSON.parse(v)}catch(e){}return seed()})();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
if(!S.code)S.code=Array.from({length:6},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random()*32|0]).join('');if(!S.owner)S.owner=(S.members[0]||{}).id||'';if(S.pin)S.reg=true;if(S.stay===undefined)S.stay=true;if(S.reg&&!S.stay)S.out=true;S.trash=S.trash||[];S.shop=S.shop||[];S.lists=S.lists||[];S.docs=S.docs||{};S.consent=S.consent||{};S.cats=S.cats||[];S.xs=S.xs||{};purge();save();
const me=()=>S.members.find(m=>m.id===S.me)||S.members[0]||{id:'',name:'',age:30};
let tab='a',view=null;
function mut(fn,msg){const p=JSON.stringify({i:S.items,c:S.chores,t:S.trash});const r=fn();msg=msg||r;save();render();if(msg)toast(msg,()=>{const o=JSON.parse(p);S.items=o.i;S.chores=o.c;S.trash=o.t||[];save();render()})}
let tt;function toast(m,undo){const t=document.createElement('div');t.className='t';t.innerHTML='<span>'+esc(m)+'</span>';if(undo){const b=document.createElement('button');b.textContent='Annulla';b.onclick=()=>{undo();t.remove()};t.appendChild(b)}$('toast').replaceChildren(t);clearTimeout(tt);tt=setTimeout(()=>t.remove(),undo?4000:1800)}
function scale(){const a=+me().age||30;return a<=45?1:a<=65?1.15:a<=80?1.32:1.5}
function card(it){const c=cat(it.cat),d=diff(it.date);
const b=it.done?'Fatto ✓':d<0?'In ritardo':d===0?'Oggi':d===1?'Domani':d<=6?'Tra '+d+' giorni':fd(it.date);
return `<div class="card ${it.done?'done':''} ${d<0&&!it.done?(d>=-3?'late':'late2'):''}" style="--c:${c.c}"><button class="chk" data-act="toggle" data-id="${it.id}" aria-label="Segna come fatto: ${esc(it.title)}">${it.done?'✓':c.i}</button><div class="bd" role="button" tabindex="0" data-act="edit" data-id="${it.id}"><small>${c.n} · ${esc(it.sub)}${it.rep!=='none'?' · 🔁':''}</small><b>${it.img?'📎 ':''}${esc(it.title)}</b><span>👤 ${esc(W(it))}${it.time?' · 🕐 '+esc(it.time):''}${it.note?' · '+esc(it.note):''}</span>${medLine(it)}</div><div class="rt"><em>${b}${it.time?'<br>🕐 '+esc(it.time):''}</em><button class="cbx ${it.done?'on':''}" data-act="toggle" data-id="${it.id}" aria-label="Conferma: ${esc(it.title)}">${it.done?'✓ Fatto':'Fatto?'}</button></div></div>`}
const byDate=(a,b)=>a.done===b.done?a.date.localeCompare(b.date):a.done?1:-1;
function render(){
const m=me();document.documentElement.style.setProperty('--s',scale());
{const h=new Date().getHours();$('hi').textContent=(h<12?'Buongiorno ':h<18?'Buon pomeriggio ':'Buonasera ')+m.name+'!'}$('nb').textContent=myNotes().length||'';
$('chips').innerHTML=S.members.map(x=>`<button class="btn sm ${x.id===m.id?'on':''}" data-act="who" data-id="${x.id}">${esc(x.name)}</button>`).join('');
const up=S.items.filter(i=>vis(i)&&diff(i.date)<=6).sort(byDate),n=up.filter(i=>!i.done).length;
$('va').innerHTML=`<h2>⏰ In scadenza <small style="font-size:.8rem;color:var(--mu)">· ${n} da fare</small></h2>`+(up.length?up.map(card).join(''):'<div class="box">🌿 Nessuna scadenza imminente.</div>')+
`<h2>Categorie impegni</h2><div class="pills">`+ALL().map(c=>{const k=S.items.filter(i=>i.cat===c.id&&!i.done).length;return `<button class="pill" style="--c:${c.c}" data-act="cat" data-id="${c.id}">${c.i} ${c.n}${k?' · '+k:''}</button>`}).join('')+'<button class="pill" style="--c:#6b7280;border-style:dashed" data-act="newcat">＋ Nuova categoria</button></div><button class="btn" style="width:100%;margin-top:1.2rem" data-act="arch">🗂 Archivio (15 giorni)</button><button class="btn" style="width:100%;margin-top:.6rem" data-act="trash">🗑 Cestino (15 giorni)</button>';
$('vc').innerHTML=calHtml();$('vs').innerHTML=shopHtml();$('tbs').innerHTML='🛒 Lista spesa'+(S.lists.some(l=>!l.del)?' <b style="background:#d1495b;color:#fff;border-radius:99px;padding:0 6px">'+S.lists.filter(l=>!l.del).length+'</b>':'');

function regGate(){return gh('Benvenuto in Family Life!',`<p style="color:var(--mu);text-align:center">Crea la tua famiglia: tu sei l’amministratore e inviterai gli altri con un link e un codice.</p><form data-form="greg"><label>Il tuo nome<input name="nm" required maxlength="30"></label><label>Età<input name="ag" type="number" min="10" max="95" required inputmode="numeric"></label><label>Scegli un PIN (4-8 numeri)<input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" minlength="4" maxlength="8" required></label>${CONSENT}${STAY}<button class="btn pri" style="width:100%;margin-top:1rem">Crea famiglia</button></form>`)}
function joinGate(c){return gh('Benvenuto in Family Life!',`<p style="color:var(--mu);text-align:center">Conferma il codice ricevuto dall’amministratore, poi inserisci solo nome ed età.</p><form data-form="join"><label>Codice<input name="code" required minlength="6" maxlength="6" value="${esc(c)}" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:.2em;font-weight:800"></label><label>Nome<input name="nm" required maxlength="30"></label><label>Età<input name="ag" type="number" min="10" max="95" required inputmode="numeric"></label><label>PIN personale (facoltativo, 4-8 numeri)<input name="mypin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" maxlength="8"></label>${DOCF}${CONSENT}${STAY}<button class="btn pri" style="width:100%;margin-top:1rem">Entra ✓</button></form>`)}
function loginGate(){return gh('Accedi',`<form data-form="glogin"><label>Nome utente<input name="nm" required maxlength="30" autocomplete="username"></label><label>Codice famiglia<input name="code" required minlength="6" maxlength="6" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:.2em;font-weight:800"></label><label>PIN (se impostato)<input name="pin" type="password" inputmode="numeric" maxlength="8"></label>${STAY}<button class="btn pri" style="width:100%;margin-top:1rem">Entra</button><button type="button" class="btn" style="width:100%;margin-top:.5rem" data-act="forgot">Hai dimenticato il PIN?</button></form>`)}
let gmode='';
function forgotGate(){return gh('Recupera PIN',`<p style="color:var(--mu);text-align:center">Amministratore: inserisci il codice di recupero ricevuto alla registrazione. Se sei un familiare, chiedi all’amministratore di reimpostare il tuo PIN.</p><form data-form="gforgot"><label>Codice famiglia<input name="code" required minlength="6" maxlength="6" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:.2em;font-weight:800"></label><label>Codice di recupero<input name="rec" required maxlength="9" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:.15em;font-weight:800"></label><label>Nuovo PIN (4-8 numeri)<input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" minlength="4" maxlength="8" required></label><button class="btn pri" style="width:100%;margin-top:.8rem">Reimposta PIN</button><button type="button" class="btn" style="width:100%;margin-top:.5rem" data-act="gback">‹ Torna all’accesso</button></form>`)}
function gate(){const g=$('gate'),inv=location.hash.match(/^#invito-([A-Z0-9]{6})$/i);if(!S.reg){g.innerHTML=inv?joinGate(inv[1].toUpperCase()):regGate();g.hidden=false}else if(S.out){g.innerHTML=gmode==='forgot'?forgotGate():loginGate();g.hidden=false}else g.hidden=true}
function dv(i){const s=i.nextElementSibling;if(!s||!s.classList.contains('dv'))return;s.textContent=i.value?(i.type==='date'?'📅 '+parse(i.value).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'long',year:'numeric'}):'🕐 '+i.value):(i.type==='date'?'📅 Tocca per scegliere la data':'🕐 Tocca per scegliere l’ora')}
function decorate(r){(r||document).querySelectorAll('input[type=date],input[type=time]').forEach(i=>{if(i.dataset.dv)return;i.dataset.dv=1;i.insertAdjacentHTML('afterend','<small class="dv"></small>');dv(i)})}
['input','change'].forEach(ev=>document.addEventListener(ev,e=>{const t=e.target;if(t.matches&&t.matches('input[type=date],input[type=time]'))dv(t)}));
new MutationObserver(()=>decorate($('dlg'))).observe($('dlg'),{childList:true,subtree:true});
function open(v){view=v;drawDlg();if(!$('dlg').open)$('dlg').showModal()}
document.addEventListener('click',e=>{
const t=e.target.closest('[data-act]');
if(!t){if(e.target===$('dlg')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}if(e.target===$('ban'))$('ban').hidden=true;return}
const a=t.dataset.act,id=t.dataset.id;
if(['add','scan','del','dchore','newcat','newsub','mrow','restore'].includes(a)&&!can()){toast('🔒 Solo l’amministratore può modificare');return}
if(a==='lock'&&me().id!==S.owner)return;
if(a==='toggle')mut(()=>{const it=S.items.find(i=>i.id===id);if(it.rep!=='none'&&!it.done){it.date=next(it.date,it.rep);return 'Fatto! Prossima volta: '+fd(it.date)}it.done=!it.done;it.doneAt=it.done?Date.now():0;if(it.done)logAct(actTxt(it));return it.done?'Fatto ✓':'Rimesso da fare'});
else if(a==='edit')open({t:'form',id});
else if(a==='cat')open({t:'cat',id,sub:'all'});
else if(a==='sub'){view.sub=id;drawDlg()}
else if(a==='add'){const c=t.dataset.cat,s=t.dataset.sub;$('dlg').close();open({t:'form',pc:c,ps:s,pd:t.dataset.date||(tab==='c'?calSel:'')})}
else if(a==='close')$('dlg').close();
else if(a==='del'){mut(()=>{const it=S.items.find(i=>i.id===id);S.items=S.items.filter(i=>i.id!==id);if(it)S.trash.unshift({...it,del:Date.now()})},'Spostato nel cestino (15 giorni)');$('dlg').close()}
else if(a==='tab'){tab=id;['a','c','f','s'].forEach(k=>{$('v'+k).hidden=tab!==k;$('tb'+k).classList.toggle('on',tab===k)});document.querySelectorAll('.fab').forEach(b=>b.hidden=tab!=='a')}
else if(a==='day'){calSel=id;render()}
else if(a==='cm'){const d=new Date(cy,cm+Number(id),1);cy=d.getFullYear();cm=d.getMonth();render()}
else if(a==='cw'){cw=id;render()}
else if(a==='mrow')$('mrows').insertAdjacentHTML('beforeend',MROW)
else if(a==='share'){const u=link(),tx='Unisciti a Family Life: apri il link e inserisci solo nome ed età. Codice: '+S.code;if(navigator.share)navigator.share({title:'Family Life',text:tx,url:u}).catch(()=>{});else{cp(tx+' '+u);toast('Link copiato 🔗')}}
else if(a==='copy'){cp(S.code);toast('Codice copiato')}
else if(a==='join')open({t:'join',code:''})
else if(a==='notif')open({t:'notif'})
else if(a==='nread'){S.seen=S.seen||{};S.seen[id]=1;save();render();drawDlg()}
else if(a==='ok'){t.classList.add('g');clearTimeout(bt);setTimeout(()=>{$('ban').hidden=true;t.classList.remove('g')},350)}
else if(a==='arch')open({t:'arch'})
else if(a==='trash')open({t:'trash'})
else if(a==='live')liveScan()
else if(a==='lsel'){S.curList=id;save();render()}
else if(a==='addmenu')open({t:'addmenu'})
else if(a==='newlist')open({t:'newlist'})
else if(a==='adminreg')open({t:'adminreg'})
else if(a==='prof')open({t:'prof'})
else if(a==='logout'){S.out=true;save();$('dlg').close();$('ban').hidden=true;gate()}
else if(a==='mdel'){if(me().id!==S.owner||id===S.owner)return;S.members=S.members.filter(m=>m.id!==id);if(S.me===id)S.me=S.owner;save();$('dlg').close();render();toast('Familiare rimosso')}
else if(a==='addshop')open({t:'addshop'})
else if(a==='qplus'){const x=S.shop.find(s=>s.id===id);const st={kg:.5,litri:.5,g:50,ml:50}[x.unit]||1;x.qty=+((x.qty||1)+st).toFixed(2);save();render()}
else if(a==='qminus'){const x=S.shop.find(s=>s.id===id);const st={kg:.5,litri:.5,g:50,ml:50}[x.unit]||1;x.qty=Math.max(st,+((x.qty||1)-st).toFixed(2));save();render()}
else if(a==='lrest'){const l=S.lists.find(l=>l.id===id);if(l)delete l.del;save();render();drawDlg()}
else if(a==='ldel'){const l=S.lists.find(l=>l.id===id);if(l)l.del=Date.now();save();render();toast('Lista spostata nell’archivio')}
else if(a==='addtm')t.closest('.pl').querySelector('.tms').insertAdjacentHTML('beforeend','<input type="time" class="pt" style="margin-bottom:.4rem">')
else if(a==='addpl')$('pls').insertAdjacentHTML('beforeend',planRow({}))
else if(a==='delpl')t.closest('.pl').remove()
else if(a==='docs')open({t:'docs'})
else if(a==='sbuy'){const v=parseFloat(String($('p'+id).value).replace(',','.'));if(!(v>=0)){toast('Scrivi il prezzo');return}const x=S.shop.find(s=>s.id===id);x.done=true;x.by=me().name;x.p=v;x.at=Date.now();logAct('ha comprato '+x.n);save();render();toast('Preso ✓ visibile a tutti')}
else if(a==='spundo'){const x=S.shop.find(s=>s.id===id);x.done=false;x.by='';x.p=0;save();render()}
else if(a==='sdel'){S.shop=S.shop.filter(s=>s.id!==id);save();render()}
else if(a==='newcat')open({t:'newcat'})
else if(a==='newsub')open({t:'newsub',id})
else if(a==='lock'){S.lock=!S.lock;save();render();toast(S.lock?'Modifiche limitate 🔒':'Modifiche libere 🔓')}
else if(a==='restore'){mut(()=>{const k=S.trash.findIndex(i=>i.id===id);if(k>=0){const[it]=S.trash.splice(k,1);delete it.del;S.items.unshift(it)}else{const it=S.items.find(i=>i.id===id);if(it){it.done=false;it.doneAt=0}}},'Ripristinato ✓');drawDlg()}
else if(a==='forgot'){gmode='forgot';gate()}else if(a==='gback'){gmode='';gate()}else if(a==='recshow'){if(me().id===S.owner)open({t:'rec'})}else if(a==='recnew'){if(me().id!==S.owner)return;S.rec=gcode();save();open({t:'rec'})}
else if(a==='who')open({t:'person',id})
else if(a==='scan')open({t:'scan',k:id});
else if(a==='theme'){const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark'}
else if(a==='tchore')mut(()=>{const c=S.chores.find(x=>x.id===id);c.done=!c.done;c.doneAt=c.done?Date.now():0;if(c.done)logAct('ha completato: '+c.title)});
else if(a==='dchore')mut(()=>{S.chores=S.chores.filter(x=>x.id!==id)},'Compito eliminato');
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.bd[data-act]')){e.preventDefault();e.target.click()}});
document.addEventListener('change',e=>{const s=e.target;if(s.id==='stayck'){S.stay=s.checked;save();return}if(s.id==='hck'){S.consent[me().id]=Object.assign({at:Date.now()},S.consent[me().id],{h:s.checked});save();toast(s.checked?'Consenso salute attivato':'Consenso salute revocato');return}if(s.name==='sl'){$('nl').hidden=s.value!=='__new';return}if(s.name==='sname'){const L=curL();L.n=s.value.trim()||'Lista della spesa';save();render();return}if(s.name==='mdoc'){s.previousSibling.textContent='✓ Foto del documento scelta';return}if(s.id==='scanfile'||s.id==='docfile'){onScan2(s.files[0],false);return}if(s.id==='joinfile'){onJoinScan(s.files[0]);return}if(s.name==='cat'&&s.form.dataset.form==='item'){s.form.sub.innerHTML=cat(s.value).s.map(x=>`<option>${esc(x)}</option>`).join('')}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f)),k=f.dataset.form;if(k!=='join'&&k!=='shop'&&k!=='newlist'&&k!=='addshop'&&k!=='swp'&&k!=='areg'&&k!=='greg'&&k!=='glogin'&&k!=='gforgot'&&k!=='mypin'&&!can()){toast('🔒 Solo l’amministratore può modificare');return}
if(k==='item'){if(['salute','medicine','piano'].includes(d.cat)&&!(S.consent[me().id]||{}).h){toast('Serve il consenso ai dati sulla salute: attivalo dal tuo profilo 👤');return}mut(()=>{const v={cat:d.cat,sub:d.sub,title:d.title.trim(),date:d.date,note:d.note.trim(),time:d.time||'',who:(new FormData(f).getAll('who').length?new FormData(f).getAll('who'):[me().name]),rep:d.rep,ntf:new FormData(f).getAll('who').filter(x=>x!==me().name),plan:readPlan(f),med:null,pk:(d.cat==='medicine'&&(d.mc||(d.mo||'').trim()))?{n:d.mc||'',o:(d.mo||'').trim()}:null};const it=S.items.find(i=>i.id===f.dataset.id);if(it)Object.assign(it,v);else S.items.unshift({id:'i'+Date.now(),done:false,...v})},'Salvato · le persone assegnate vedono la notifica');$('dlg').close()}
else if(k==='join'){const m={id:'m'+Date.now(),name:d.nm.trim(),age:Math.max(10,Math.min(95,parseInt(d.ag,10)||30))};if(d.mypin)m.pin=d.mypin;if(S.demo){S.members=[];S.items=[];S.chores=[];S.demo=false}S.members.push(m);S.me=m.id;S.code=d.code.toUpperCase();S.reg=true;S.out=false;S.stay=!!d.stay;S.consent[m.id]={at:Date.now(),h:!!d.consent_h};{const fl=new FormData(f).get('mdoc'),ty=new FormData(f).get('mdt');if(fl&&fl.size)shrink(fl).then(img=>{if(img){S.docs[m.id]=[{t:ty,img}];save()}})}try{history.replaceState(null,'',location.pathname)}catch(x){}save();$('dlg').close();render();gate();toast('Benvenuto/a '+m.name+'!')}
else if(k==='scan'){scanSave(f,d)}
else if(k==='member'){memberSave(f)}
else if(k==='addshop'){let id=d.sl;if(id==='__new'){const nm=(d.ln||'').trim();if(!nm){toast('Scrivi il nome della lista');return}id='l'+Date.now();S.lists.push({id,n:nm});logAct('ha creato la lista '+nm)}else if(!(d.n||'').trim()){toast('Scrivi il prodotto');return}if((d.n||'').trim()){S.shop.unshift({id:'s'+Date.now(),n:d.n.trim(),done:false,qty:Math.max(.1,parseFloat(String(d.qt).replace(',','.'))||1),unit:d.un||'',l:id});logAct('ha aggiunto '+d.n.trim()+' alla lista spesa')}save();render();view={t:'addshop',sl:id};drawDlg();toast('Aggiunto ✓ puoi continuare')}
else if(k==='greg'){const ag=Math.max(10,Math.min(95,parseInt(d.ag,10)||30));if(S.demo){S.members=[];S.items=[];S.chores=[];S.demo=false}let m=S.members.find(x=>x.name.toLowerCase()===d.nm.trim().toLowerCase());if(m)m.age=ag;else{m={id:'m'+Date.now(),name:d.nm.trim(),age:ag};S.members.push(m)}S.owner=m.id;S.pin=d.pin;S.me=m.id;S.consent[m.id]={at:Date.now(),h:!!d.consent_h};S.reg=true;S.out=false;S.stay=!!d.stay;S.rec=gcode();save();render();gate();open({t:'rec'})}
else if(k==='glogin'){const m=S.members.find(x=>x.name.toLowerCase()===d.nm.trim().toLowerCase());if(!m){toast('Utente non trovato');return}if(String(d.code).toUpperCase()!==S.code){toast('Codice errato');return}{const need=m.id===S.owner?S.pin:m.pin;if(need&&d.pin!==need){toast('PIN errato');return}}S.me=m.id;S.out=false;S.stay=!!d.stay;save();render();gate()}
else if(k==='gforgot'){if(String(d.code).toUpperCase()!==S.code||!S.rec||String(d.rec).toUpperCase().replace(/[\s-]/g,'')!==S.rec){toast('Codici non corretti');return}S.pin=d.pin;S.rec=gcode();S.me=S.owner;S.out=false;gmode='';save();render();gate();open({t:'rec'})}
else if(k==='mypin'){const m=me();if(m.id===S.owner)return;m.pin=d.pin||undefined;save();toast(d.pin?'PIN impostato ✓':'PIN rimosso')}
else if(k==='mpin'){if(me().id!==S.owner)return;const p=S.members.find(x=>x.id===f.dataset.id);if(p&&p.id!==S.owner){p.pin=d.pin||undefined;save();toast(d.pin?'PIN di '+p.name+' reimpostato ✓':'PIN di '+p.name+' rimosso')}}
else if(k==='pset'){const p=S.members.find(m=>m.id===f.dataset.id);if(p)p.age=Math.max(10,Math.min(95,parseInt(d.ag,10)||p.age));save();$('dlg').close();render();toast('Impostazioni salvate')}
else if(k==='swp'){if(me().id!==S.owner&&S.pin&&d.pin!==S.pin){toast('PIN errato');return}S.me=f.dataset.id;save();$('dlg').close();render();toast('Profilo cambiato')}
else if(k==='areg'){if(S.pin&&d.old!==S.pin){toast('PIN attuale errato');return}const ag=Math.max(10,Math.min(95,parseInt(d.ag,10)||30));let m=S.members.find(x=>x.name.toLowerCase()===d.nm.trim().toLowerCase());if(m)m.age=ag;else{m={id:'m'+Date.now(),name:d.nm.trim(),age:ag};S.members.push(m)}S.owner=m.id;S.pin=d.pin;S.me=m.id;S.consent[m.id]={at:Date.now(),h:!!d.consent_h};S.rec=gcode();save();render();open({t:'rec'})}
else if(k==='newlist'){curL();const l={id:'l'+Date.now(),n:d.ln.trim()};S.lists.push(l);S.curList=l.id;save();$('dlg').close();render();toast('Lista creata 🛒')}
else if(k==='shop'){S.shop.unshift({id:'s'+Date.now(),n:d.n.trim(),done:false,l:S.curList||'l1'});save();render();toast('Aggiunto alla lista 🛒')}
else if(k==='newcat'){S.cats.push({id:'x'+Date.now(),n:d.nm.trim(),i:(d.em||'📁').trim(),c:PAL[S.cats.length%6],s:['Generale']});save();$('dlg').close();render();toast('Categoria creata ✓')}
else if(k==='newsub'){const id=f.dataset.id;(S.xs[id]=S.xs[id]||[]).push(d.nm.trim());save();view={t:'cat',id,sub:'all'};drawDlg();render();toast('Sottocategoria creata ✓')}
else if(k==='chore')mut(()=>{S.chores.unshift({id:'c'+Date.now(),title:d.title.trim(),who:(new FormData(f).getAll('who').length?new FormData(f).getAll('who'):[me().name]),done:false})},'Compito assegnato');
});
function clock(){const n=new Date();$('dt').textContent=n.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})+' · '+n.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}
clock();setInterval(clock,30000);render();
gate();$('dlg').addEventListener('close',()=>stopLive());banner();const hm=location.hash.match(/^#invito-([A-Z0-9]{6})$/i);if(hm&&S.reg&&!S.out)open({t:'join',code:hm[1].toUpperCase()});
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
