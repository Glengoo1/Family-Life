async function hashPin(pin,saltHex){
  const salt=saltHex?Uint8Array.from(saltHex.match(/../g).map(h=>parseInt(h,16))):crypto.getRandomValues(new Uint8Array(16));
  const key=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:310000,hash:"SHA-256"},key,256);
  return hex(salt)+":"+hex(bits);
}
const checkPin=async(pin,st)=>!!st&&(await hashPin(pin,st.split(":")[0]))===st;

function mergeRemote(rem){
  const mergeById=(locArr,remArr,delIds=new Set())=>{
    const map=new Map();
    (remArr||[]).forEach(x=>{if(x&&x.id&&!delIds.has(x.id))map.set(x.id,x)});
    (locArr||[]).forEach(x=>{
      if(!x||!x.id||delIds.has(x.id))return;
      const r=map.get(x.id);
      if(!r||(x.modAt&&(!r.modAt||x.modAt>r.modAt)))map.set(x.id,x);
    });
    return Array.from(map.values());
  };
  const trashIds=new Set([...(rem.trash||[]),...(S.trash||[])].map(x=>x.id));
  if(rem.owner)S.owner=rem.owner;
  if(Array.isArray(rem.members)&&rem.members.length)S.members=rem.members;
  if(Array.isArray(rem.cats)&&rem.cats.length)S.cats=rem.cats;
  if(Array.isArray(rem.trash))S.trash=mergeById(S.trash,rem.trash);
  if(Array.isArray(rem.items))S.items=mergeById(S.items,rem.items,trashIds);
  if(Array.isArray(rem.shop))S.shop=mergeById(S.shop,rem.shop);
  if(Array.isArray(rem.pay))S.pay=mergeById(S.pay,rem.pay).sort((a,b)=>b.at-a.at);
  if(Array.isArray(rem.act)){
    const am=new Map();
    [...rem.act,...S.act].forEach(a=>{if(a&&a.k)am.set(a.k,a)});
    S.act=Array.from(am.values()).sort((a,b)=>b.at-a.at).slice(0,30);
  }
  if(rem.updatedAt)S.updatedAt=Math.max(S.updatedAt||0,rem.updatedAt);
}

function purge(){
  const n=Date.now();
  if(!Array.isArray(S.cats)||!S.cats.length)S.cats=DEF();
  S.pay=S.pay||[];S.trash=S.trash||[];
  S.items=S.items.filter(i=>!(i.done&&i.doneAt&&n-i.doneAt>15*864e5));
  S.shop=S.shop.filter(x=>!x.done||n-x.at<62*864e5);
  S.act=S.act.slice(0,30);
  S.trash=S.trash.filter(i=>n-i.del<16*864e5);
  S.pay=S.pay.filter(p=>{const d=new Date(p.at);return n<new Date(d.getFullYear(),d.getMonth()+2,2).getTime()});
}

function calHtml(){
  const first=new Date(cy,cm,1),st=(first.getDay()+6)%7,n=new Date(cy,cm+1,0).getDate();
  let cells="<span></span>".repeat(st);
  for(let d=1;d<=n;d++){
    const s=iso(new Date(cy,cm,d)),its=S.items.filter(i=>vis(i)&&i.date===s&&canSee(i));
    cells+=`<button class="day ${s===calSel?"sel":""} ${s===off(0)?"tod":""}" data-act="day" data-id="${s}" aria-label="${d} ${first.toLocaleDateString("it-IT",{month:"long"})}"><b>${d}</b><div class="dots">${its.slice(0,3).map(i=>`<i style="background:${safeColor(cat(i.cat).c)}"></i>`).join("")}</div></button>`;
  }
  const sel=S.items.filter(i=>vis(i)&&i.date===calSel&&canSee(i)).sort(byDate);
  return `<div class="row" style="margin:.5rem 0"><button class="btn sm" data-act="cm" data-id="-1" aria-label="Mese precedente">‹</button><h2 style="margin:0;text-transform:capitalize">${first.toLocaleDateString("it-IT",{month:"long",year:"numeric"})}</h2><button class="btn sm" data-act="cm" data-id="1" aria-label="Mese successivo">›</button></div>
  <div class="cal">${[..."LMMGVSD"].map(x=>`<small>${x}</small>`).join("")}${cells}</div>
  <h2>${parse(calSel).toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"})}</h2>
  ${sel.length?sel.map(card).join(""):'<div class="box">Nessun impegno.</div>'}
  <button class="btn pri" style="width:100%" data-act="add" data-date="${esc(calSel)}">＋ Aggiungi impegno</button>`;
}

function shopHtml(){
  const it=S.shop.filter(x=>!x.done||Date.now()-x.at<57600000).sort((a,b)=>a.done-b.done);
  return `<h2>🛒 Lista spesa</h2><form class="box" data-form="shop"><label>Prodotto<input name="n" required maxlength="40"></label><label>Quantità<input name="qt" type="number" min="1" step="1" value="1"></label><button class="btn pri" style="width:100%;margin-top:.7rem">Aggiungi</button></form>`+
  (it.length?it.map(x=>`<div class="card ${x.done?"done":""}"><div class="bd" style="cursor:default"><b>${esc(x.n)}${x.qty>1?" × "+esc(x.qty):""}</b><br><small>${x.done?"✓ "+esc(x.by)+" · "+f2(x.p):"Da comprare"}</small>${x.done?"":`<div class="row" style="margin-top:.4rem"><input id="p${esc(x.id)}" inputmode="decimal" placeholder="€ prezzo" style="width:7rem"><button class="btn sm pri" data-act="sbuy" data-id="${esc(x.id)}">✓ Preso</button></div>`}</div><button class="btn sm dng" data-act="sdel" data-id="${esc(x.id)}" aria-label="Elimina">🗑</button></div>`).join(""):'<div class="box">Lista vuota.</div>');
}

const monthName=m=>new Date(+m.slice(0,4),+m.slice(5)-1,1).toLocaleDateString("it-IT",{month:"long",year:"numeric"});
function payBlock(list){
  const g={};list.forEach(p=>(g[p.by]=g[p.by]||[]).push(p));
  return Object.keys(g).sort().map(n=>`<div class="box"><div class="row"><b>👤 ${esc(n)}</b><b>${f2(g[n].reduce((s,p)=>s+p.a,0))}</b></div>${g[n].sort((a,b)=>b.at-a.at).map(p=>`<div class="row"><small>${esc(cat(p.cat).i)} ${esc(p.t)} · ${fd(iso(new Date(p.at)))}</small><small>${f2(p.a)}</small></div>`).join("")}</div>`).join("")||'<div class="box mu">Nessun pagamento.</div>';
}
function payHtml(){
  const P=S.pay.filter(p=>isAdmin()||p.by===me().name),cur=mk(Date.now()),old=[...new Set(P.map(p=>mk(p.at)).filter(m=>m!==cur))].sort().reverse();
  return `<div class="row"><h2>💶 Pagamenti di ${esc(monthName(cur))}</h2>${P.length?`<button class="btn sm" data-act="csv">📥 CSV</button>`:""}</div>${payBlock(P.filter(p=>mk(p.at)===cur))}`+(old.length?`<h2>🗄️ Archivio pagamenti</h2><small class="mu">Ogni estratto resta visibile per il mese successivo (più un giorno), poi si cancella.</small>${old.map(m=>`<h2 style="text-transform:capitalize">${esc(monthName(m))}</h2>${payBlock(P.filter(p=>mk(p.at)===m))}`).join("")}`:"");

let busy=false;
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act]");
  if(!t){if(e.target===$("dlg")){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}return}
  const a=t.dataset.act,id=t.dataset.id;
  if(a==="tab"){
    tab=id;
    ["a","c","s","f"].forEach(k=>{
      $("v"+k).hidden=tab!==k;
      const b=$("tb"+k);b.classList.toggle("on",tab===k);b.setAttribute("aria-selected",String(tab===k));
    });
    $("fab").hidden=tab!=="a";
  }
  else if(a==="font"){S.fsIdx=((S.fsIdx||0)+1)%FONT_STEPS.length;applyFont();save(true);toast("Testo: "+["Normale","Grande","Molto grande"][S.fsIdx])}
  else if(a==="who"){if(id===me().id||isAdmin()){S.me=id;save(true);render()}else openDlg({t:"pin",id})}
  else if(a==="ics"){const it=S.items.find(i=>i.id===id);if(it&&downloadIcs(it))toast("Evento pronto 📅")}
  else if(a==="csv")exportPayCsv();
  else if(a==="toggle"){
    const it=S.items.find(i=>i.id===id);if(!it||!canSee(it))return;
    const snap={...it};
    if(it.rep!=="none"&&!it.done){
      const pid=it.amt>0?addPay(it.cat,it.title,it.amt):"";
      it.date=nextDate(it.date,it.rep);it.modAt=Date.now();
      logAct("ha completato (ricorrente): "+it.title);
      save();render();
      toast("Fatto! Prossima: "+fd(it.date),()=>{
        Object.assign(it,snap,{modAt:Date.now()});
        if(pid)S.pay=S.pay.filter(p=>p.id!==pid);
        save();render();toast("Azione annullata");
      });
    }else{
      it.done=!it.done;it.doneAt=it.done?Date.now():0;it.modAt=Date.now();
      if(it.done){logAct("ha completato: "+it.title);if(it.amt>0)it.pid=addPay(it.cat,it.title,it.amt)}
      else if(it.pid){S.pay=S.pay.filter(p=>p.id!==it.pid);it.pid=""}
      save();render();
      toast(it.done?"Fatto ✓":"Rimesso da fare",()=>{
        if(it.done&&it.pid)S.pay=S.pay.filter(p=>p.id!==it.pid);
        Object.assign(it,snap,{modAt:Date.now()});
        if(snap.done&&snap.amt>0)it.pid=addPay(it.cat,it.title,it.amt);
        save();render();toast("Azione annullata");
      });
    }
  }
  else if(a==="edit"){const it=S.items.find(i=>i.id===id);if(it&&canSee(it))openDlg({t:"form",id})}
  else if(a==="add")openDlg({t:"form",pd:t.dataset.date||""});
  else if(a==="close")$("dlg").close();
  else if(a==="del"){
    const it=S.items.find(i=>i.id===id);
    if(it&&canSee(it)){
      S.items=S.items.filter(i=>i.id!==id);
      const tr={...it,del:Date.now()};
      S.trash.unshift(tr);save();render();$("dlg").close();
      toast("Spostato nel cestino",()=>{
        S.trash=S.trash.filter(x=>x.id!==tr.id);
        S.items.unshift({...it,modAt:Date.now()});
        save();render();toast("Ripristinato ✓");
      });
    }
  }
  else if(a==="day"){calSel=id;render()}
  else if(a==="cm"){const d=new Date(cy,cm+Number(id),1);cy=d.getFullYear();cm=d.getMonth();render()}
  else if(a==="share"){
    const u=location.href.split("#")[0]+"#invito-"+S.code,tx="Unisciti a Family Life!";
    if(navigator.share){navigator.share({title:"Family Life",text:tx,url:u}).catch(()=>{})}
    else{try{await navigator.clipboard.writeText(tx+" "+u);toast("Link copiato negli appunti")}catch(x){toast("Copia manualmente il codice sopra")}}
  }
  else if(a==="copy"){try{await navigator.clipboard.writeText(S.code);toast("Codice copiato")}catch(x){toast("Seleziona e copia il codice manualmente")}}
  else if(a==="cats"&&isAdmin())openDlg({t:"cats"});
  else if(a==="catedit"&&isAdmin())openDlg({t:"catedit",id});
  else if(a==="catdel"&&isAdmin()&&id!=="varie"){S.cats=S.cats.filter(c=>c.id!==id);save();render();openDlg({t:"cats"})}
  else if(a==="trestore"){const i=S.trash.find(x=>x.id===id);if(i&&canSee(i)){S.trash=S.trash.filter(x=>x.id!==id);delete i.del;i.modAt=Date.now();S.items.unshift(i);save();render();toast("Ripristinato ✓")}}
  else if(a==="tdel"){const i=S.trash.find(x=>x.id===id);if(i&&canSee(i)){S.trash=S.trash.filter(x=>x.id!==id);save();render()}}
  else if(a==="prof")openDlg({t:"prof"});
  else if(a==="push"){
    if(!("Notification" in window))return toast("Notifiche non supportate dal browser");
    const r=await Notification.requestPermission();
    toast(r==="granted"?"Notifiche attive ✓":"Permesso notifiche non concesso");
  }
  else if(a==="logout"){S.out=true;save(true);$("dlg").close();gate()}
  else if(a==="wipe"){if(confirm("Cancellare tutti i dati locali? Il cloud non viene toccato.")){localStorage.removeItem(K);location.reload()}}
  else if(a==="sbuy"){
    const inp=$("p"+id),v=parseFloat(String(inp?inp.value:"").replace(",","."));
    if(!(v>=0))return toast("Scrivi il prezzo");
    const x=S.shop.find(s=>s.id===id);
    if(x){
      const pid=v>0?addPay("varie",x.n,v):"";
      Object.assign(x,{done:true,by:me().name,p:v,at:Date.now(),modAt:Date.now(),pid});
      logAct("ha comprato "+x.n);save();render();
      toast("Preso ✓",()=>{
        Object.assign(x,{done:false,by:"",p:0,at:0,modAt:Date.now(),pid:""});
        if(pid)S.pay=S.pay.filter(p=>p.id!==pid);
        save();render();toast("Azione annullata");
      });
    }
  }
  else if(a==="sdel"){S.shop=S.shop.filter(s=>s.id!==id);save();render()}
});

document.addEventListener("submit",async e=>{
  e.preventDefault();if(busy)return;
  const f=e.target,fd_=new FormData(f),d=Object.fromEntries(fd_),k=f.dataset.form;busy=true;
  try{
    const nm=(d.nm||"").trim(),ag=Math.max(14,Math.min(95,parseInt(d.ag,10)||30));
    if(k==="item"){
      const who=fd_.getAll("who"),id=f.dataset.id||uid("i");
      const v={cat:d.cat,sub:d.sub||"",amt:Math.max(0,parseFloat(String(d.amt||"").replace(",","."))||0),title:d.title.trim(),date:d.date,time:d.time||"",note:(d.note||"").trim(),who:who.length?who:[me().name],rep:REP[d.rep]?d.rep:"none",modAt:Date.now()};
      let it=S.items.find(i=>i.id===id);
      if(it){if(!canSee(it))return;Object.assign(it,v)}else{it={id,done:false,...v};S.items.unshift(it)}
      save();render();$("dlg").close();toast("Salvato ✓");downloadIcs(it);
    }else if(k==="catedit"){if(!isAdmin())return;const id=f.dataset.id,o={n:d.n.trim(),i:(d.i||"📁").trim().slice(0,8),c:safeColor(d.c),s:subs(d.s||"")},c=S.cats.find(x=>x.id===id);
      if(c)Object.assign(c,o);else{const v=S.cats.findIndex(x=>x.id==="varie");S.cats.splice(v<0?S.cats.length:v,0,{id:uid("x"),...o})}
      save();render();openDlg({t:"cats"});toast("Categoria salvata ✓")
    }else if(k==="shop"){
      S.shop.unshift({id:uid("s"),n:d.n.trim(),qty:Math.max(1,parseInt(d.qt,10)||1),done:false,modAt:Date.now()});save();render();
    }else if(k==="switchpin"){
      const t=S.members.find(x=>x.id===f.dataset.id);if(!t)return;
      if(!(await checkPin(d.pin,t.pin)))return toast("PIN errato");
      S.me=t.id;save(true);$("dlg").close();render();
    }else if(k==="changepin"){
      const m=S.members.find(x=>x.id===me().id);if(m){m.pin=await hashPin(d.npin);save();$("dlg").close();toast("PIN aggiornato ✓")}
    }else if(k==="member"){
      if(!isAdmin())return;
      if(S.members.some(x=>x.name.toLowerCase()===nm.toLowerCase()))return toast("Nome già usato");
      S.members.push({id:uid("m"),name:nm,age:ag,pin:await hashPin(d.pin)});save();render();toast("Familiare aggiunto ✓");
    }else if(k==="greg"){
      const code=newCode(),m={id:uid("m"),name:nm,age:ag,pin:await hashPin(d.pin)};
      if(!window.FL_SYNC)return toast("Cloud non pronto: riprova tra un attimo");
      if(await window.FL_SYNC.pull(code))return toast("Collisione codice, riprova");
      Object.assign(S,seed(),{code,members:[m],owner:m.id,me:m.id,reg:true,consentAt:Date.now(),fsIdx:S.fsIdx||0});
      save();await window.FL_SYNC.push(S);window.FL_SYNC.bind(code);render();gate();toast("Famiglia creata ✓");
    }else if(k==="join"){
      const code=String(d.code||"").toUpperCase().trim();
      if(!CODE_RE.test(code))return toast("Codice non valido");
      if(!window.FL_SYNC)return toast("Cloud non pronto: riprova tra un attimo");
      const rem=await window.FL_SYNC.pull(code);
      if(!rem)return toast("Codice famiglia non trovato");
      const base=Object.assign(seed(),pick(rem));
      if(base.members.some(x=>x.name.toLowerCase()===nm.toLowerCase()))return toast("Nome già usato in famiglia");
      const m={id:uid("m"),name:nm,age:ag,pin:await hashPin(d.pin)};
      base.members.push(m);
      S=Object.assign(base,{code,me:m.id,reg:true,out:false,consentAt:Date.now(),fsIdx:S.fsIdx||0});
      try{history.replaceState(null,"",location.pathname)}catch(x){}
      save();window.FL_SYNC.bind(code);render();gate();toast("Benvenuto/a "+nm+"!");
    }else if(k==="glogin"){
      if(window.FL_SYNC&&S.code){const rem=await window.FL_SYNC.pull(S.code);if(rem)mergeRemote(pick(rem))}
      const m=S.members.find(x=>x.name.toLowerCase()===nm.toLowerCase());
      if(!m||!(await checkPin(d.pin,m.pin)))return toast("Nome o PIN errati");
      S.me=m.id;S.out=false;save(true);render();gate();
    }
  }catch(err){toast("Errore: "+(err&&err.message||err))}
  finally{busy=false}
});

const clock=()=>{
  const n=new Date();
  $("dt").textContent=n.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"})+" · "+n.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
  const curDay=off(0);
  if(curDay!==lastDayStr){
    if(calSel===lastDayStr)calSel=curDay;
    cy=n.getFullYear();cm=n.getMonth();lastDayStr=curDay;render();
  }
};
clock();setInterval(()=>{clock();purge()},30000);render();gate();
</script>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
let unsub=null,active="";
try{
  const app=initializeApp(window.FL_FIREBASE_CONFIG);
  await signInAnonymously(getAuth(app));
  const db=getFirestore(app),ref=c=>doc(db,"families",c);
  const pull=async c=>{const s=await getDoc(ref(c.toUpperCase()));return s.exists()?s.data():null};
  function bind(code){
    const c=(code||"").toUpperCase();if(!c||(unsub&&active===c))return;
    if(unsub)unsub();active=c;setSt("sincronizzato");
    unsub=onSnapshot(ref(c),snap=>{
      if(!snap.exists())return;const d=snap.data();
      if(d.updatedAt&&S.updatedAt&&d.updatedAt<=S.updatedAt)return;
      const prev=S.act[0]&&S.act[0].k;remoteLock=true;
      try{
        mergeRemote(pick(d));
        if(S.reg&&S.members.length&&!S.members.some(m=>m.id===S.me)){S.me="";S.out=true;gate()}
        purge();save(true);render();
      }finally{remoteLock=false}
      const top=S.act[0];if(top&&top.k!==prev&&top.by!==me().name){toast("📣 "+top.by+" "+top.t);notify("Family Life",top.by+" "+top.t)}
    },()=>setSt("in attesa · dati locali"));
  }
  window.FL_SYNC={bind,pull,push:async st=>{
    const c=st.code;if(!c)return;
    await setDoc(ref(c),{code:c,owner:st.owner,members:st.members,items:st.items,shop:st.shop,cats:st.cats,pay:st.pay,trash:st.trash,act:st.act.slice(0,30),updatedAt:st.updatedAt||Date.now()},{merge:true});
    setSt("sincronizzato");
  }};
  if(S.code&&S.reg)bind(S.code);else setSt("in attesa di famiglia");
}catch(e){setSt("non collegato · dati locali")}
</script>
